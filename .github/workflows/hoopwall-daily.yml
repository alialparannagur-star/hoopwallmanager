  <p class="mut">${L(`İlk beş, dakikalar ve oyun planı Taktik sekmesinden ayarlanır. Takım gücü: <b>${rating(U).toFixed(1)}</b> · Sezonluk bordro: <b>${money(payroll(U))}</b>. Oyuncu adına tıklayınca kartı açılır.`,`Starters, minutes and game plan are set in the Tactics tab. Team rating: <b>${rating(U).toFixed(1)}</b> · Season payroll: <b>${money(payroll(U))}</b>. Click a name to open the player card.`)}</p>
  ${playerTable(ps,v,{own:true,act:act1})}</div>
