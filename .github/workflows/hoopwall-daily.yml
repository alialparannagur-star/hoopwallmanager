    ${opp?`<div style="min-width:260px"><div class="mut">${nm.type} · ${nm.home?'🏠':'✈️'} vs <b>${esc(opp.name)}</b></div><div class="row" style="gap:8px;margin-top:4px"><span class="big" style="font-size:36px;color:${wp>=.55?'var(--gr)':wp<=.45?'var(--rd)':'var(--txt)'}">%${Math.round(wp*100)}</span><span class="mut">${L('tahmini kazanma şansı','estimated win chance')}<br>${L('taktik değiştikçe güncellenir','updates as you change tactics')}</span></div>
