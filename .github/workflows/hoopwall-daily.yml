   <div class="scroll"><table><tr><th>${L('Oyuncu','Player')}</th><th>${L('Poz','Pos')}</th><th class="num">${L('Yaş','Age')}</th><th class="num">OVR</th><th>${L('Kulüp','Club')}</th></tr>${ps.map(p=>`<tr ${p.t===G.user?'class="me"':''}><td>${pName(p)}</td><td>${p.pos}</td><td class="num">${p.a}</td><td class="num">${ovrTag(p.o)}</td><td class="mut">${p.t>=0?esc(G.teams[p.t].name)+' · '+lgF(G.teams[p.t].c,G.teams[p.t].l):''}${p.t===G.user?' <span class="or">★</span>':''}</td></tr>`).join('')}</table></div></div>
