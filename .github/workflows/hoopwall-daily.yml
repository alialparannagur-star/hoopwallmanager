    S.forEach((s,li)=>s.forEach((t,pos)=>{if(!isHuman(t))return;const pr=(17-pos-1)*POS_PRIZE[LEAGUES[li].t]+POS_PRIZE[LEAGUES[li].t];t.m.money+=pr;addNews(t.id,`📊 ${LEAGUES[li].k} Ligi'ni <b>${pos+1}.</b> bitirdin. Ödül: ${money(pr)}`,`📊 You finished <b>${pos+1}${['st','nd','rd'][pos]||'th'}</b> in the ${LEAGUES[li].k} League. Prize: ${money(pr)}`)}));
    const [A,B1,B2,C1,C2,C3,C4]=S;
    const nl=[A.slice(0,14).concat([B1[0],B2[0]]),B1.slice(1,14).concat([A[14],C1[0],C2[0]]),B2.slice(1,14).concat([A[15],C3[0],C4[0]]),
      C1.slice(1).concat([B1[14]]),C2.slice(1).concat([B1[15]]),C3.slice(1).concat([B2[14]]),C4.slice(1).concat([B2[15]])];
    nl.forEach((arr,li)=>arr.forEach(t=>{if(t.l!==li){addNews(t.id,li<t.l?`⬆️ <b>TERFİ!</b> Yeni sezonda ${LEAGUES[li].k} Ligi'ndesin.`:`⬇️ Düştün… Yeni sezonda ${LEAGUES[li].k} Ligi'ndesin.`,li<t.l?`⬆️ <b>PROMOTED!</b> Next season you play in the ${LEAGUES[li].k} League.`:`⬇️ Relegated… Next season you play in the ${LEAGUES[li].k} League.`);t.l=li}}));
    c.leagues.forEach((lg,li)=>{lg.teams=shuffle(nl[li].map(t=>t.id));lg.fx=makeFixtures(16);lg.res=[]});
  });
  G.hist.unshift(hist);if(G.hist.length>60)G.hist.length=60;
  // gelişim + emeklilik
  const retire=new Set();
  Object.values(G.P).forEach(p=>{const tf=p.t>=0?G.teams[p.t].f:[1,1,1,1,1];develop(p,tf);const rm=1-.05*(tf[3]-1);
    if(!p.y&&(p.a>=38||(p.a>=33&&Math.random()<(p.a-32)*.18*rm)||(p.a>=30&&p.o<42&&Math.random()<.5))){retire.add(p.id);
      if(p.t>=0)addNews(p.t,`👋 <b>${esc(p.n)}</b> (${p.a}, OVR ${p.o}) emekli oldu.`,`👋 <b>${esc(p.n)}</b> (${p.a}, OVR ${p.o}) retired.`)}});
  G.teams.forEach(t=>{t.p=t.p.filter(id=>!retire.has(id))});G.fa=G.fa.filter(id=>!retire.has(id));retire.forEach(id=>delete G.P[id]);
