function kupa(){
  if(UI.cc===null)UI.cc=G.teams[G.user].c;
  const ci=UI.cc,K=G.countries[ci].cup,RN=CUP_RN();
  const tieRow=t=>{const H=G.teams[t[0]],A=G.teams[t[1]],me=t[0]===G.user||t[1]===G.user,res=t[2]!==null;
    return `<tr ${me?'class="me"':''}><td>${esc(H.name)} <span class="mut">${LEAGUES[H.l].k}</span></td><td class="num"><b>${res?scoreLink(`<span class="${t[2]>t[3]?'grt':''}">${t[2]}</span> – <span class="${t[3]>t[2]?'grt':''}">${t[3]}</span>`,t[4]):'vs'}</b></td><td>${esc(A.name)} <span class="mut">${LEAGUES[A.l].k}</span></td></tr>`};
  const sortMe=a=>a.slice().sort((x,y)=>((y[0]===G.user||y[1]===G.user)-(x[0]===G.user||x[1]===G.user))||(G.teams[x[0]].l+G.teams[x[1]].l)-(G.teams[y[0]].l+G.teams[y[1]].l));
  const myCountry=ci===G.teams[G.user].c;
  let myPath='';if(myCountry){const steps=[];K.done.forEach((ties,r)=>{const t=ties.find(x=>x[0]===G.user||x[1]===G.user);if(t){const won=(t[0]===G.user)===(t[2]>t[3]);steps.push(`<span class="pill">${RN[r]}: <b class="${won?'grt':'rdt'}">${won?L('G','W'):L('M','L')}</b> ${t[0]===G.user?t[2]+'-'+t[3]:t[3]+'-'+t[2]}</span>`)}});
    const bye=K.byes.includes(G.user)&&K.r===0;const alive=K.champ===null&&(K.ties.some(x=>x[0]===G.user||x[1]===G.user)||bye);
    myPath=`<div class="row">${steps.join('')||''}${bye?`<span class="pill">${L('1. turu bay geçiyorsun (A Ligi)','Bye in Round 1 (A League)')}</span>`:''}${K.champ===G.user?'<span class="pill or">🏆 '+L('Şampiyon','Champion')+'</span>':alive?'<span class="pill grt">'+L('Kupada devam','Still in the cup')+'</span>':steps.length?'<span class="pill rdt">'+L('Elendin','Eliminated')+'</span>':''}</div>`}
  const last=K.done.length?K.done[K.done.length-1]:null;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>🏆 ${flag(ci)} ${L('Ülke Kupası','National Cup')}</h3>${countrySel(ci,'UI.cc=+this.value;render()')}</div>
  <p class="mut">${L('Ülkedeki 112 takımın hepsi tek maçlık eleme usulü oynar. A Ligi takımları 1. turu bay geçer. Ev sahibi her zaman alt ligdeki takımdır. Maçlar 3, 7, 11, 15, 19, 23 ve 27. günlerde, lig maçının yanında oynanır.','All 112 clubs play single-game knockouts. A League clubs get a first-round bye. The lower-league side always hosts. Rounds are on days 3, 7, 11, 15, 19, 23 and 27, alongside league games.')}</p>
  <div class="row">${RN.map((n,r)=>`<span class="pill" style="${r===K.r&&K.champ===null?'color:var(--or);border:1px solid var(--or)':''}">${n} · ${L('Gün','Day')} ${CUP_DAYS[r]+1} · ${money(CUP_PRIZE[r])}</span>`).join('')}</div>
  ${myPath?`<h3 style="margin-top:12px">${L('Senin yolun','Your run')}</h3>${myPath}`:''}</div>
  <div class="grid" style="margin-top:14px">
  ${K.champ!==null?`<div class="card"><h3>🏆 ${L('Şampiyon','Champion')}</h3><div class="big">${esc(G.teams[K.champ].name)}</div></div>`:`<div class="card"><h3>${L('Sıradaki tur','Next round')}: ${RN[K.r]} <span class="mut">(${L('Gün','Day')} ${CUP_DAYS[K.r]+1})</span></h3><div class="scroll"><table>${sortMe(K.ties).slice(0,64).map(tieRow).join('')}</table></div>${K.r===0?`<p class="mut">+ ${L('16 A Ligi takımı bay geçiyor','16 A League clubs have a bye')}</p>`:''}</div>`}
  ${last?`<div class="card"><h3>${L('Son tur sonuçları','Last round results')}: ${RN[K.done.length-1]}</h3><div class="scroll"><table>${sortMe(last).slice(0,64).map(tieRow).join('')}</table></div></div>`:''}</div>`;
}
