const WCACHE={open(){return new Promise(res=>{const to=setTimeout(()=>res(null),2000);try{const r=indexedDB.open('hoopwall-online',1);r.onupgradeneeded=()=>r.result.createObjectStore('w');r.onsuccess=()=>{clearTimeout(to);res(r.result)};r.onerror=()=>{clearTimeout(to);res(null)}}catch(e){clearTimeout(to);res(null)}})},
  async get(){const db=await this.open();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('w').objectStore('w').get('world');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  async put(v){const db=await this.open();if(!db)return;try{db.transaction('w','readwrite').objectStore('w').put(v,'world')}catch(e){}}};
