/* ---------- dünya üretimi ---------- */
function teamNames(c,n){const all=[];c.cities.forEach(ci=>c.nick.forEach(nk=>all.push(ci+' '+nk)));return shuffle(all).slice(0,n)}
function newTeam(name,ci,li){
  const t={id:G.teams.length,name,c:ci,l:li,p:[],y:[],w:0,lo:0,pf:0,pa:0,iw:0,il:0,ipf:0,ipa:0,form:[],f:[1,1,1,1,1]};
  G.teams.push(t);const tier=LEAGUES[li].t,size=rnd(13,15);
  for(let i=0;i<size;i++){const p=newPlayer(ci,tier,false,0,POS[i%5]);p.t=t.id;t.p.push(p.id)}
  for(let i=0,n=rnd(3,5);i<n;i++){const p=newPlayer(ci,tier,true);p.t=t.id;t.y.push(p.id)}
  return t;
}
function makeFixtures(n){const arr=[...Array(n).keys()],R=[];
  for(let r=0;r<n-1;r++){const rd=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if(r%2&&i===0)[h,a]=[a,h];rd.push([h,a])}R.push(rd);arr.splice(1,0,arr.pop())}
  return R.concat(R.map(rd=>rd.map(([h,a])=>[a,h])))}
function genWorld(){
  G={v:VERSION,season:1,day:0,tick:0,seq:1,teams:[],P:{},nid:0,fa:[],countries:[],intl:null,nat:null,auc:[],aucN:0,bx:{},bxN:0,hist:[],out:{news:[],reassign:[]}};
  COUNTRIES.forEach((c,ci)=>{const names=teamNames(c,112);let k=0;
    const leagues=LEAGUES.map((_,li)=>{const ids=[];for(let i=0;i<16;i++)ids.push(newTeam(names[k++],ci,li).id);return {teams:ids,fx:makeFixtures(16),res:[]}});
    G.countries.push({leagues,cup:null});
    for(let i=0;i<25;i++)G.fa.push(newPlayer(ci,rnd(1,2),false).id);
    setupCup(ci);
  });
  setupIntl(G.countries.map(c=>c.leagues[0].teams.map(id=>G.teams[id]).sort((a,b)=>rating(b)-rating(a))[0].id));
  natInit();
}
function setupIntl(ids){const n=ids.length,m=n%2?n+1:n,fx=makeFixtures(m).slice(0,m-1);
  G.intl={teams:shuffle(ids.slice()),n,fx,res:[],days:fx.map((_,r)=>Math.floor(r*DAYS/fx.length))};
  G.intl.teams.forEach(id=>{const t=G.teams[id];t.iw=t.il=t.ipf=t.ipa=0})}
const intlTeam=i=>i<G.intl.n?G.teams[G.intl.teams[i]]:null;

/* ---------- ülke kupası ---------- */
function cupTie(a,b){const A=G.teams[a],B=G.teams[b];let h=a,w=b;if(B.l>A.l||(B.l===A.l&&Math.random()<.5)){h=b;w=a}return [h,w,null,null]}
function pairUp(ids){shuffle(ids);const t=[];for(let i=0;i<ids.length;i+=2)t.push(cupTie(ids[i],ids[i+1]));return t}
function setupCup(ci){const C=G.countries[ci],rest=[];for(let li=1;li<7;li++)rest.push(...C.leagues[li].teams);
  C.cup={r:0,ties:pairUp(rest),byes:C.leagues[0].teams.slice(),done:[],champ:null}}
function playCupRound(ci,r){
  const C=G.countries[ci],K=C.cup;if(K.champ!==null||K.r!==r)return;
  const win=[];K.ties.forEach(t=>{const res=playMatch(t[0],t[1],2);t[2]=res[0];t[3]=res[1];t[4]=res[5];const w=res[0]>res[1]?t[0]:t[1],l=w===t[0]?t[1]:t[0];win.push(w);
    const W=G.teams[w];if(isHuman(W)){const pr=CUP_PRIZE[r];W.m.money+=pr;addNews(w,r===6?`🏆 <b>KUPA ŞAMPİYONU OLDUN!</b> +${money(pr)}`:`🏆 Kupada ${CUP_TR[r]} geçildi! +${money(pr)}`,r===6?`🏆 <b>YOU WON THE CUP!</b> +${money(pr)}`:`🏆 Cup: through the ${CUP_EN[r]}! +${money(pr)}`)}
    addNews(l,`❌ Kupaya ${CUP_TR[r]} aşamasında veda ettin.`,`❌ Knocked out of the cup in the ${CUP_EN[r]}.`)});
  K.done.push(K.ties);
  let next=win;if(r===0)next=win.concat(K.byes);
  if(next.length===1){K.champ=next[0];K.ties=[];newsCountry(ci,`🏆 ${flag(ci)} Kupa şampiyonu: <b>${esc(G.teams[next[0]].name)}</b>`,`🏆 ${flag(ci)} Cup winner: <b>${esc(G.teams[next[0]].name)}</b>`)}
  else K.ties=pairUp(next);
  K.r++;
}

/* ---------- güç / taktik ---------- */
const roster=t=>t.p.map(id=>G.P[id]).filter(Boolean).sort((a,b)=>b.o-a.o);
function rating(t){const ps=roster(t),w=[1,1,1,1,1,.75,.6,.45,.3,.2];let s=0,ws=0;for(let i=0;i<10;i++){s+=(ps[i]?ps[i].o:30)*w[i];ws+=w[i]}return s/ws}
const DEF_TAC={off:'bal',def:'man',tempo:1,reb:1,agg:1,star:null,stop:null,st:null,min:null};
function tac(t){if(!t.tac){t.tac=copy(DEF_TAC);if(!isHuman(t))botTac(t)}return t.tac}
const SLOT_PEN=[0,0,3,6,9],GAME_MIN=200,TIRED=30,VTIRED=33,MAXMIN=40;
function autoStarters(t){const ps=roster(t),used=new Set(),st=[];
  POS.forEach((_,i)=>{let best=null,bs=-1e9;ps.forEach(p=>{if(used.has(p.id))return;const sc=p.o-SLOT_PEN[Math.abs(POS.indexOf(p.pos)-i)];if(sc>bs){bs=sc;best=p}});if(best){used.add(best.id);st.push(best.id)}});return st}
function autoMinutes(t,st){st=st||autoStarters(t);const m={};st.forEach(id=>m[id]=27);
  const bench=roster(t).filter(p=>!st.includes(p.id)),bm=[20,16,12,9,5,3];let left=65;
  bench.forEach((p,i)=>{if(i<bm.length){m[p.id]=bm[i];left-=bm[i]}});
  for(let i=0;left>0;i=(i+1)%st.length){if(m[st[i]]<34){m[st[i]]++;left--}else if(st.every(id=>m[id]>=34))break}
  return m}
function lineup(t){const T=tac(t);let st=(T.st||[]).filter(id=>t.p.includes(id));if(st.length!==5||new Set(st).size!==5)st=autoStarters(t);
  const m=(isHuman(t)&&T.min)?{...T.min}:autoMinutes(t,st);
  const ids=t.p.filter(id=>(m[id]||0)>0&&G.P[id]);st.forEach(id=>{if(!(m[id]>0)){m[id]=10;ids.push(id)}});
  const sum=ids.reduce((a,id)=>a+m[id],0);if(sum>0&&sum!==GAME_MIN)ids.forEach(id=>m[id]=m[id]*GAME_MIN/sum);
  Object.keys(m).forEach(k=>{if(!ids.includes(+k))delete m[k]});
  ids.sort((a,b)=>(st.indexOf(b)>=0)-(st.indexOf(a)>=0)||(st.indexOf(a)-st.indexOf(b))||m[b]-m[a]);
  return {st,m,ids}}
const PROFC=new Map();
function teamProf(t){if(t.id>=0&&!isHuman(t)){const k=Math.floor(G.tick/5),n=t.p.join(','),c=PROFC.get(t.id);if(c&&c.k===k&&c.n===n&&c.tc===t.tac)return c.v;const v=teamProf0(t);PROFC.set(t.id,{k,n,tc:t.tac,v});return v}return teamProf0(t)}
function teamProf0(t){const lu=lineup(t),P={t3:0,ins:0,spd:0,pas:0,hnd:0,pdf:0,idf:0,stl:0,reb:0};let r=0;
  lu.ids.forEach(id=>{const p=G.P[id],m=lu.m[id],si=lu.st.indexOf(id);let e=p.o*(1-Math.max(0,m-TIRED)*.009);if(si>=0)e-=SLOT_PEN[Math.abs(POS.indexOf(p.pos)-si)];r+=e*m;
    const a=p.at;P.t3+=a[0]*m;P.ins+=(a[2]+a[8])/2*m;P.spd+=a[7]*m;P.pas+=a[4]*m;P.hnd+=(a[5]+a[6])/2*m;P.pdf+=a[11]*m;P.idf+=a[12]*m;P.stl+=a[13]*m;P.reb+=a[10]*m});
  Object.keys(P).forEach(k=>P[k]/=GAME_MIN);let rr=r/GAME_MIN;if(isHuman(t)&&t.m.tr)rr+=[.5,0,-1.5][t.m.tr.i]||0;return {r:rr,P,lu}}
function sideEff(X,Y,TX,TY){let v=1.02+(X.r-Y.r)*.012;const x=X.P,y=Y.P;
  if(TX.off==='ins'){v+=(x.ins-y.idf)*.0025;if(TY.def==='zone')v-=.015}
  else if(TX.off==='per'){v+=(x.t3-y.pdf)*.0025;if(TY.def==='zone')v+=.012}
  else if(TX.off==='trn'){v+=(x.spd-y.spd)*.003;if(TY.def==='press')v+=.01}
  else v+=((x.ins-y.idf)+(x.t3-y.pdf))*.001+.004;
  if(TY.def==='zone')v-=(y.idf-60)*.001-Math.max(0,x.t3-58)*.0015;
  else if(TY.def==='press')v-=((y.spd+y.stl)-(x.hnd+x.pas))*.001;
  else v-=((y.pdf+y.idf)/2-60)*.0008;
  if(TX.def==='press')v-=.012;
  if(TX.reb===2)v+=.015*x.reb/60;if(TY.reb===2)v+=.012;if(TX.reb===0)v-=.007;if(TY.reb===0)v-=.008;
  if(TY.agg===2)v-=.006+(y.pdf-60)*.0005;if(TX.agg===2)v-=.004;if(TY.agg===0)v+=.006;if(TX.agg===0)v+=.002;
  if(TX.star!=null&&X.lu.ids.includes(TX.star))v+=(G.P[TX.star].o-X.r)*.0008;
  if(TY.stop!=null&&X.lu.ids.includes(TY.stop)){const sp=G.P[TY.stop];v-=Math.max(0,sp.o-X.r)*.0025*(X.lu.m[TY.stop]/30);v+=.004}
  return v}
function expectMatch(H,A,home=true){const h=teamProf(H),a=teamProf(A),TH=tac(H),TA=tac(A);
  let poss=74+(TH.tempo+TA.tempo-2)*2.5+(TH.off==='trn'?2:0)+(TA.off==='trn'?2:0)+(TH.def==='press'?1.5:0)+(TA.def==='press'?1.5:0);
  let pH=sideEff(h,a,TH,TA),pA=sideEff(a,h,TA,TH);if(home)pH+=.022+.002*H.f[0];return {pH,pA,poss,h,a}}
function winProb(H,A){const e=expectMatch(H,A,true),m=e.poss*(e.pH-e.pA);return 1/(1+Math.exp(-m/6.5))}
function botTac(t){const T=t.tac,P=teamProf(t).P,r=Math.random();
  const opts=[['ins',P.ins],['per',P.t3+2],['trn',P.spd-2]].sort((a,b)=>b[1]-a[1]);T.off=r<.3?'bal':opts[0][0];
  const d=Math.random();T.def=d<.6?'man':(d<.85?(P.idf>P.pdf?'zone':'man'):(P.spd+P.stl>125?'press':'man'));
  T.tempo=P.spd>62?2:P.spd<52?0:1;T.agg=rnd(0,2);T.reb=1;T.star=null;T.stop=null;T.st=null;T.min=null}
function box(t,pts,lu,TX,TY,noStat){
  const ps=lu.ids.map(id=>G.P[id]),mins=lu.ids.map(id=>Math.round(lu.m[id])),A=(p,k)=>p.at[AI[k]],J=()=>.7+Math.random()*.6;
  const ws=ps.map((p,i)=>mins[i]*Math.pow(p.o/70,2)*POSF[p.pos].s*(.65+Math.random()*.7)*(p.id===TX.star?1.4:1)*(p.id===TY.stop?.6:1)*(TX.off==='per'?(A(p,'3PT')/60):TX.off==='ins'?(A(p,'FIN')/60):1));
  const W={r:ps.map((p,i)=>mins[i]*Math.pow((A(p,'REB')*.7+A(p,'STR')*.3)/60,2)*J()),a:ps.map((p,i)=>mins[i]*Math.pow(A(p,'PAS')/60,2.5)*J()),
    st:ps.map((p,i)=>mins[i]*Math.pow(A(p,'STL')/60,3)*Math.random()),bl:ps.map((p,i)=>mins[i]*Math.pow((A(p,'IDF')+A(p,'JMP'))/120,4)*Math.random()),
    to:ps.map((p,i)=>(ws[i]+mins[i]*.4)*(75/A(p,'HND'))*Math.random())};
  const T={r:rnd(34,46)+(TX.reb===2?3:TX.reb===0?-2:0),a:rnd(16,28),st:rnd(4,11)+(TX.def==='press'?3:0)+(TX.agg===2?1:0),bl:rnd(2,7)+(TX.def==='zone'?1:0),to:rnd(9,17)+(TY.def==='press'?3:0)};
  const ftF=TY.agg===2?1.5:TY.agg===0?.75:1,s3F=TX.off==='per'?1.35:TX.off==='ins'?.7:1;
  const sum=a=>a.reduce((x,y)=>x+y,0)||1,SW={};Object.keys(W).forEach(k=>SW[k]=sum(W[k]));const sw=sum(ws);
  let left=pts;const lines=[];
  ps.forEach((p,i)=>{let v=i===ps.length-1?left:Math.round(pts*ws[i]/sw);v=Math.max(0,Math.min(v,left));left-=v;
    const q=k=>Math.round(T[k]*W[k][i]/SW[k]);
    const t3=A(p,'3PT'),fi=(A(p,'FIN')+A(p,'MID'))/2,ftA=A(p,'FT');
    let ftm=Math.min(v,Math.round(v*clamp((.06+(A(p,'FIN')+A(p,'STR')-100)/700)*ftF,.03,.35)*(.6+Math.random()*.8)));
    const r=v-ftm,sh3=clamp(((t3-35)/70+(Math.random()-.5)*.2)*s3F,0,.75);let tpm=Math.round(r*sh3/3),rem=r-3*tpm,m2=Math.floor(rem/2);ftm+=rem-2*m2;
    const p3=clamp(.25+(t3-40)*.004+gauss()*.04,.12,.55),p2=clamp(.40+(fi-40)*.0045+gauss()*.05,.28,.75),pf=clamp(.62+(ftA-40)*.0055+gauss()*.04,.4,.95);
    const tpa=tpm?Math.max(tpm,Math.round(tpm/p3)):(sh3>.2?rnd(0,2):0),a2=m2?Math.max(m2,Math.round(m2/p2)):rnd(0,2),fta=ftm?Math.max(ftm,Math.round(ftm/pf)):(Math.random()<.3?rnd(1,2):0);
    const line=[p.id,mins[i],v,q('r'),q('a'),q('st'),q('bl'),q('to'),tpm+m2,tpa+a2,tpm,tpa,ftm,fta];
    if(!noStat){p.g++;for(let k=0;k<12;k++)p.S[k]+=line[k+2];p.S[12]+=mins[i]}lines.push(line)});
  return lines;
}
let HL=new Set();   // içinde insan takımı olan ligler (maç detayları saklanır)
function playMatch(hid,aid,mode){
  const H=G.teams[hid],A=G.teams[aid],E=expectMatch(H,A,true),poss=E.poss+rnd(-3,3);
  let hs=Math.round(poss*(E.pH+gauss()*.07)),as=Math.round(poss*(E.pA+gauss()*.07));
  let ot=0;while(hs===as){hs+=rnd(4,14);as+=rnd(4,14);ot++}
  const bh=box(H,hs,E.h.lu,tac(H),tac(A)),ba=box(A,as,E.a.lu,tac(A),tac(H));
  if(mode===1){H.ipf+=hs;H.ipa+=as;A.ipf+=as;A.ipa+=hs;if(hs>as){H.iw++;A.il++}else{A.iw++;H.il++}}
  else if(mode===0){H.pf+=hs;H.pa+=as;A.pf+=as;A.pa+=hs;if(hs>as){H.w++;A.lo++}else{A.w++;H.lo++}
    H.form.push(hs>as?'W':'L');A.form.push(as>hs?'W':'L');if(H.form.length>5)H.form.shift();if(A.form.length>5)A.form.shift()}
  const hH=isHuman(H),hA=isHuman(A);let bid=null;
  if(hH||hA||(mode===0&&HL.has(H.c*10+H.l))){bid=G.bxN++;G.bx[bid]={h:hid,a:aid,hs,as,ot,mode,day:G.day+1,bh,ba}}
  if(hH){H.m.boxes.push(bid);userResult(H,A,hs,as,mode);if(hs>as)H.m.money+=Math.round(income(H)*.5)}
  if(hA){A.m.boxes.push(bid);userResult(A,H,as,hs,mode);if(as>hs)A.m.money+=Math.round(income(A)*.5)}
  const top=[...bh,...ba].sort((x,y)=>y[2]-x[2])[0];
  return [hs,as,top[0],top[2],ot,bid];
}
function playDay(){
  if(G.day>=DAYS){endSeason();return 'season'}
  const d=G.day,hs=humans();hs.forEach(t=>t.m.boxes=[]);HL=new Set(hs.map(t=>t.c*10+t.l));
  G.countries.forEach(c=>c.leagues.forEach(lg=>{lg.res[d]=lg.fx[d].map(([h,a])=>playMatch(lg.teams[h],lg.teams[a],0))}));
  const ir=G.intl.days.indexOf(d);
  if(ir>=0)G.intl.res[ir]=G.intl.fx[ir].map(([h,a])=>(h>=G.intl.n||a>=G.intl.n)?null:playMatch(G.intl.teams[h],G.intl.teams[a],1));
  const cr=CUP_DAYS.indexOf(d);if(cr>=0)G.countries.forEach((_,ci)=>playCupRound(ci,cr));
  natDay(d);
  G.day++;marketTick();trainAll();
  for(const t of hs){const m=t.m;m.money+=income(t)-Math.round(payroll(t)/DAYS);
    if(m.money<0&&!m.neg){m.neg=true;addNews(t.id,'⚠️ <b>Kasa eksiye düştü!</b> Eksideyken imza, transfer ve inşaat yapamazsın. Maaş yükünü azalt.','⚠️ <b>You are in debt!</b> No signings, transfers or construction while negative. Cut your payroll.')}
    if(m.money>=0)m.neg=false;
    m.builds=m.builds.filter(b=>{b.left--;if(b.left>0)return true;t.f[b.i]++;addNews(t.id,`🏗️ ${FAC[b.i].i} <b>${FAC[b.i].tr}</b> seviye ${t.f[b.i]} oldu!`,`🏗️ ${FAC[b.i].i} <b>${FAC[b.i].en}</b> reached level ${t.f[b.i]}!`);return false});
    checkAch(t)}
  if(G.day===DAYS)newsCountry(null,'🏁 Normal sezon bitti! Yarın sezon sonu: terfi/düşme, ödüller, emeklilikler ve yeni sezon.','🏁 Regular season over! Tomorrow: promotion/relegation, prizes, retirements and the new season.');
  return 'day';
}
function standings(ids,intl){return ids.map(id=>G.teams[id]).sort((a,b)=>{const wa=intl?a.iw:a.w,wb=intl?b.iw:b.w;if(wb!==wa)return wb-wa;return (intl?b.ipf-b.ipa:b.pf-b.pa)-(intl?a.ipf-a.ipa:a.pf-a.pa)})}

