  ${st.map((t,i)=>`<tr class="cl ${t.id===G.user?'me':''} ${i===0?'up':''} ${tier<2&&i>=14?'dn':''}" onclick="openTeam(${t.id})"><td>${i+1}</td><td>${esc(t.name)}</td><td class="num">${t.w}</td><td class="num">${t.lo}</td><td class="num">${t.pf-t.pa>0?'+':''}${t.pf-t.pa}</td><td style="font-size:11px">${formHtml(t.form)}</td></tr>`).join('')}</table></div>`}
/* ================= KULÜP: KUPA DOLABI, ROZETLER, TARİH ================= */
function kulup(){
  const C=G.club||[],R=G.rec||{},A=G.ach||{},U=G.teams[G.user];
  const cnt=(f)=>C.filter(f).length,tro=[['👑',L('A Ligi','A League'),cnt(e=>e.pos===1&&e.l===0)],['🥇',L('Alt lig şampiyonluğu','Lower league titles'),cnt(e=>e.pos===1&&e.l>0)],['🏆',L('Ülke Kupası','National Cup'),cnt(e=>e.cupChamp)],['🌎',L('Uluslararası','International'),cnt(e=>e.intlChamp)],['🌐',L('Milletler Kupası (hoca)','Nations Cup (coach)'),(G.nat?G.nat.hist:[]).filter(h=>h.coach===G.user).length]];
  const got=ACH.filter(a=>A[a[0]]).length;
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">🏛️ ${L('Kulüp & kariyer','Club & career')}</h3><div class="mut">${flag(U.c)} ${esc(U.name)} · ${lgF(U.c,U.l)} · ${C.length} ${L('sezon tamamlandı','seasons completed')}</div></div><button class="pri" onclick="shareClub()">📤 ${L('Kulüp kartını paylaş','Share club card')}</button></div></div>
  <div class="card" style="margin-top:14px"><h3>🏆 ${L('Kupa dolabı','Trophy cabinet')}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">${tro.map(([i,n,c])=>`<div class="ccard" style="cursor:default;${c?'':'opacity:.4'}"><div style="font-size:40px">${i}</div><div class="big" style="font-size:30px">${c}</div><div class="mut" style="font-size:12px">${n}</div></div>`).join('')}</div></div>
  <div class="card" style="margin-top:14px"><h3>🏅 ${L('Rozetler','Badges')} <span class="mut">${got}/${ACH.length}</span></h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px">${ACH.map(a=>{const u=A[a[0]];return `<div class="card" style="padding:10px;${u?'border-color:var(--or)':'opacity:.45;filter:grayscale(1)'}"><div class="row" style="gap:8px"><span style="font-size:28px">${a[1]}</span><div><b>${L(a[2],a[3])}</b><div class="mut" style="font-size:12px">${L(a[4],a[5])}</div>${u?`<div class="or" style="font-size:11px">S${u.s} ${L('G','D')}${u.d}</div>`:''}</div></div></div>`}).join('')}</div></div>
  <div class="grid" style="margin-top:14px"><div class="card"><h3>📊 ${L('Rekorlar','Records')}</h3><table>
   <tr><td>${L('En uzun galibiyet serisi','Longest win streak')}</td><td class="num"><b>${R.streak||0}</b> <span class="mut">(${L('şu an','now')} ${G.streak||0})</span></td></tr>
   <tr><td>${L('En farklı galibiyet','Biggest win')}</td><td class="num">${R.big?`<b>+${R.big.m}</b> <span class="mut">${R.big.sc} vs ${esc(R.big.opp)} (S${R.big.s})</span>`:'–'}</td></tr>
   <tr><td>${L('En çok galibiyetli sezon','Most wins in a season')}</td><td class="num">${R.wins?`<b>${R.wins.w}-${R.wins.lo}</b> <span class="mut">S${R.wins.s}</span>`:'–'}</td></tr>
   <tr><td>${L('En skorer oyuncu (sezon)','Best scoring season')}</td><td class="num">${R.scorer?`<b>${esc(R.scorer[0])}</b> ${R.scorer[1]} ${L('sayı','ppg')} <span class="mut">S${R.scorer[2]}</span>`:'–'}</td></tr></table></div>
  <div class="card"><h3>📜 ${L('Sezon sezon tarih','Season by season')}</h3>${C.length?`<div class="scroll"><table><tr><th>${L('Sezon','Season')}</th><th>${L('Kulüp','Club')}</th><th>${L('Lig','League')}</th><th class="num">${L('Sıra','Pos')}</th><th class="num">${L('G-M','W-L')}</th><th>${L('Kupa','Cup')}</th><th>🌍</th><th>${L('En skorer','Top scorer')}</th><th class="num">🎯</th></tr>
   ${C.map(e=>`<tr><td>${e.s}</td><td style="font-size:12px">${esc(e.name)}</td><td>${lgF(e.c,e.l)}</td><td class="num">${e.pos===1?'🥇':e.pos}</td><td class="num">${e.w}-${e.lo}</td><td style="font-size:12px">${e.cupChamp?'🏆':e.cw>=7?'🏆':CUP_RN()[Math.min(6,e.cw)]||'–'}</td><td>${e.ip?(e.intlChamp?'🌎':e.ip+'.'):'–'}</td><td style="font-size:12px">${e.top?esc(e.top[0])+' '+e.top[1]:'–'}</td><td class="num">${e.ok}/4</td></tr>`).join('')}</table></div><p class="mut" style="font-size:12px">${L('Kupa sütunu: elendiği tur. 🎯: tutan yönetim hedefi.','Cup column: round of elimination. 🎯: board objectives met.')}</p>`:`<p class="mut">${L('İlk sezon bitince burada görünür.','Appears after your first season.')}</p>`}</div></div>`;
}
/* ================= ŞAMPİYONLAR ARŞİVİ ================= */
function sampiyonlar(){if(UI.hc==null)UI.hc=G.teams[G.user].c;const ci=UI.hc,H=G.hist,uid=G.user;
  const cell=(n,id)=>`<td style="font-size:12px" class="${id===uid?'or':''}">${n?esc(n):'–'}${id===uid?' ★':''}</td>`;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🏆 ${L('Şampiyonlar arşivi','Hall of champions')}</h3>${countrySel(ci,'UI.hc=+this.value;render()')}</div>
   <p class="mut">${L('Her sezonun tüm lig, kupa, uluslararası ve milli turnuva şampiyonları. ★ senin takımın.','Every season\'s champions in every league, cup, international and national tournament. ★ = your club.')}</p></div>
  <div class="card" style="margin-top:14px"><h3>${flag(ci)} ${cn(ci)} — ${L('lig ve kupa şampiyonları','league & cup champions')}</h3>${H.length?`<div class="scroll"><table><tr><th>${L('Sezon','Season')}</th>${LEAGUES.map(l=>`<th>${l.k}</th>`).join('')}<th>${L('Kupa','Cup')}</th></tr>
   ${H.map(h=>`<tr><td>${h.season}</td>${LEAGUES.map((_,li)=>h.lg&&h.lg[ci]?cell(h.lg[ci][li][0],h.lg[ci][li][1]):li===0?cell(h.champs[ci]):'<td class="mut">–</td>').join('')}${cell(h.cups[ci])}</tr>`).join('')}</table></div>`:`<p class="mut">${L('İlk sezon bitince burada görünür.','Appears after the first season.')}</p>`}</div>
  <div class="grid" style="margin-top:14px"><div class="card"><h3>🌍 ${L('Uluslararası Lig','International League')}</h3>${H.length?`<table>${H.map(h=>`<tr><td>${L('Sezon','Season')} ${h.season}</td><td class="${h.it===uid?'or':''}">${flag(h.ic)} ${esc(h.intl)}${h.it===uid?' ★':''}</td></tr>`).join('')}</table>`:'<p class="mut">–</p>'}</div>
   <div class="card"><h3>🌐 ${L('Milletler Kupası','Nations Cup')}</h3>${G.nat&&G.nat.hist.length?`<table>${G.nat.hist.map(h=>`<tr><td>${L('Sezon','Season')} ${h.season}</td><td>${flag(h.c)} ${cn(h.c)}${h.coach===G.user?' <span class="or">🧑‍🏫 '+L('hoca: sen','coach: you')+'</span>':''}</td></tr>`).join('')}</table>`:'<p class="mut">–</p>'}</div>
   <div class="card"><h3>🌐 ${L('Tüm ülkelerin A Ligi şampiyonları','A League champions — all countries')}</h3>${H.length?`<div class="scroll"><table><tr><th>${L('Ülke','Country')}</th>${H.slice(0,5).map(h=>`<th>S${h.season}</th>`).join('')}</tr>${COUNTRIES.map((c,i)=>`<tr><td>${flag(i)} ${cn(i)}</td>${H.slice(0,5).map(h=>`<td style="font-size:12px">${esc(h.champs[i])}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="mut">–</p>'}</div></div>`;
}
/* ================= SOSYAL ================= */
function sosyal(){wallCheck();const U=G.teams[G.user];
  return `<div class="grid"><div class="card" style="grid-column:span 2"><h3>💬 ${lgF(U.c,U.l)} — ${L('lig duvarı','league wall')}</h3>
   <div class="row"><input id="wallIn" maxlength="200" placeholder="${L('Bir şey yaz… (rakiplere laf at, maçı yorumla)','Say something… (trash talk, game talk)')}" style="flex:1" onkeydown="if(event.key==='Enter')sendWall()"><button class="pri" onclick="sendWall()">${L('Gönder','Post')}</button></div>
   <div style="margin-top:10px;max-height:520px;overflow:auto">${G.wall.msgs.map(m=>{const t=m.who>=0?G.teams[m.who]:null,me=m.who===G.user;return `<div style="display:flex;gap:10px;padding:8px;border-bottom:1px solid #1e2530;${me?'background:#2a1c0c;border-radius:8px':''}"><div style="width:34px;height:34px;border-radius:50%;background:${me?'var(--or)':'var(--panel2)'};display:flex;align-items:center;justify-content:center;font-weight:700;flex:none">${t?esc(t.name[0]):'🏀'}</div><div style="flex:1"><div><b>${t?esc(t.name):L('Lig yönetimi','League office')}</b> ${t&&!me?'<span class="mut" style="font-size:11px">🤖</span>':''} <span class="mut" style="font-size:11px">S${m.s} ${L('G','D')}${m.d}</span></div><div>${L(m.tr,m.en)}</div></div></div>`}).join('')}</div>
   <p class="mut" style="font-size:12px">${L('Bu duvarı ligindeki bütün menajerler görür. Saygılı ol!','Every manager in your league sees this wall. Be respectful!')}</p></div>
  <div class="card"><h3>📤 ${L('Paylaş','Share')}</h3><p class="mut">${L('Maç sonucunu veya kulüp kartını şık bir görsel olarak paylaş: Instagram, WhatsApp, X…','Share a slick image of a result or your club card: Instagram, WhatsApp, X…')}</p>
   ${G.boxes.length?G.boxes.map(id=>{const b=G.bx[id];return b?`<button class="pri" style="margin:4px 0;width:100%" onclick="shareMatch(${id})">🏀 ${esc(TM(b.h).name)} ${b.hs}–${b.as} ${esc(TM(b.a).name)}</button>`:''}).join(''):`<p class="mut">${L('Henüz maç yok.','No games yet.')}</p>`}
   <button style="margin-top:6px;width:100%" onclick="shareClub()">🏛️ ${L('Kulüp kartı','Club card')}</button>
   <h3 style="margin-top:16px">👥 ${L('Arkadaş ligi','Friends league')}</h3><p class="mut">${L('Çok oyunculu sürümde: arkadaşlarına davet linki gönderip kendi özel kupanızı kuracaksınız. Herkes kendi kulübüyle katılır, maçlar normal takvimin dışında oynanır.','In the multiplayer version: send invite links to friends and set up your own private cup. Everyone joins with their club; games are played outside the normal schedule.')}</p><span class="pill">🔒 ${L('Yakında','Coming soon')}</span></div></div>`;
}
/* ================= PAYLAŞILABİLİR KART (canvas) ================= */
function flagImg(ci){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">${FLAG_SVG[COUNTRIES[ci].id]}</svg>`)})}
function cardBase(){const cv=document.createElement('canvas');if(!cv.getContext)return null;cv.width=1080;cv.height=1080;const x=cv.getContext('2d');if(!x)return null;
  const g=x.createLinearGradient(0,0,1080,1080);g.addColorStop(0,'#2a1606');g.addColorStop(.55,'#0e1116');g.addColorStop(1,'#0b1a2b');x.fillStyle=g;x.fillRect(0,0,1080,1080);
  x.fillStyle='#ff7a1a';x.fillRect(0,0,1080,14);x.globalAlpha=.06;x.beginPath();x.arc(900,880,420,0,7);x.lineWidth=40;x.strokeStyle='#ff7a1a';x.stroke();x.globalAlpha=1;
  x.font='800 54px "Barlow Condensed",Arial';x.fillStyle='#fff';x.textBaseline='alphabetic';x.fillText('HOOP',60,100);const w=x.measureText('HOOP').width;x.fillStyle='#ff7a1a';x.fillText('WALL',60+w,100);x.fillStyle='#fff';x.fillText(' MANAGER',60+w+x.measureText('WALL').width,100);
  x.font='600 26px Inter,Arial';x.fillStyle='#8b97a8';x.fillText('hoopwall manager · '+L('basketbol menajerlik','basketball management'),60,1030);return {cv,x}}
function fitText(x,t,maxW,size,weight='800',fam='"Barlow Condensed",Arial'){let s=size;do{x.font=`${weight} ${s}px ${fam}`;s-=2}while(x.measureText(t).width>maxW&&s>20);return t}
async function shareMatch(id){const b=G.bx[id];if(!b)return;const B=cardBase();if(!B)return toast(L('Tarayıcın görsel oluşturmayı desteklemiyor.','Your browser cannot create images.'));const {cv,x}=B;
  const H=TM(b.h),A=TM(b.a),fh=await flagImg(H.c),fa=await flagImg(A.c);
  x.font='600 30px Inter,Arial';x.fillStyle='#ffb066';x.textAlign='right';x.fillText(`${MODE_N()[b.mode].replace(/[^\p{L}\p{N} ]/gu,'').trim()} · ${L('Sezon','Season')} ${G.season} · ${L('Gün','Day')} ${b.day}`,1020,100);x.textAlign='left';
  const col=(t,f,cx,sc,win)=>{if(f)x.drawImage(f,cx-75,230,150,100);x.textAlign='center';x.fillStyle='#fff';fitText(x,t.name,440,56);x.fillText(t.name,cx,400);x.font='900 190px "Barlow Condensed",Arial';x.fillStyle=win?'#ff7a1a':'#c9d1dc';x.fillText(sc,cx,600);x.textAlign='left'};
  col(H,fh,280,b.hs,b.hs>b.as);col(A,fa,800,b.as,b.as>b.hs);x.font='800 90px "Barlow Condensed",Arial';x.fillStyle='#55606f';x.textAlign='center';x.fillText('–',540,570);if(b.ot){x.font='700 34px Inter,Arial';x.fillStyle='#ffb066';x.fillText(L('UZATMA','OVERTIME'),540,640)}x.textAlign='left';
  x.fillStyle='#ffffff14';x.fillRect(60,680,960,300);
  const tops=(lines,cx)=>{lines.slice().sort((p,q)=>q[2]-p[2]).slice(0,3).forEach((l,i)=>{const p=G.P[l[0]];if(!p)return;x.font='700 32px Inter,Arial';x.fillStyle='#fff';fitText(x,p.n,420,32,'700','Inter,Arial');x.fillText(p.n,cx,740+i*86);x.font='500 26px Inter,Arial';x.fillStyle='#8b97a8';x.fillText(`${l[2]} ${L('SAY','PTS')} · ${l[3]} ${L('RİB','REB')} · ${l[4]} ${L('AST','AST')}`,cx,775+i*86)})};
  tops(b.bh,90);tops(b.ba,580);showCard(cv,`hoopwall-${b.hs}-${b.as}.png`)}
async function shareClub(){const B=cardBase();if(!B)return toast(L('Tarayıcın görsel oluşturmayı desteklemiyor.','Your browser cannot create images.'));const {cv,x}=B,U=G.teams[G.user],f=await flagImg(U.c),C=G.club||[];
  if(f)x.drawImage(f,60,170,120,80);x.fillStyle='#fff';fitText(x,U.name,800,84);x.fillText(U.name,200,240);x.font='600 34px Inter,Arial';x.fillStyle='#ffb066';x.fillText(`${cn(U.c)} · ${LEAGUES[U.l].k} ${L('Ligi','League')} · ${L('Sezon','Season')} ${G.season}`,60,320);
  const stats=[[`${U.w}-${U.lo}`,L('Bu sezon','This season')],[rating(U).toFixed(1),L('Takım gücü','Team rating')],[C.filter(e=>e.pos===1).length+C.filter(e=>e.cupChamp).length+C.filter(e=>e.intlChamp).length,L('Kupa','Trophies')],[Object.keys(G.ach||{}).length+'/'+ACH.length,L('Rozet','Badges')]];
  stats.forEach(([v,l],i)=>{const cx=60+i*245;x.fillStyle='#ffffff10';x.fillRect(cx,380,225,200);x.textAlign='center';x.font='900 80px "Barlow Condensed",Arial';x.fillStyle='#ff7a1a';x.fillText(String(v),cx+112,490);x.font='600 26px Inter,Arial';x.fillStyle='#8b97a8';x.fillText(l,cx+112,545);x.textAlign='left'});
  const best=roster(U).slice(0,3);x.font='700 34px Inter,Arial';x.fillStyle='#fff';x.fillText(L('Yıldızlar','Stars'),60,660);best.forEach((p,i)=>{x.font='700 32px Inter,Arial';x.fillStyle='#fff';x.fillText(p.n,60,720+i*60);x.font='700 32px Inter,Arial';x.fillStyle='#2ecc71';x.textAlign='right';x.fillText(`${p.pos} · OVR ${p.o}`,1020,720+i*60);x.textAlign='left'});
  const ach=ACH.filter(a=>(G.ach||{})[a[0]]).slice(-10).map(a=>a[1]).join(' ');x.font='48px Arial';x.fillText(ach,60,960);showCard(cv,'hoopwall-club.png')}
function showCard(cv,fname){let url='';try{url=cv.toDataURL('image/png')}catch(e){return toast('!')}
  showModal(`<div class="row" style="justify-content:space-between"><h3 style="margin:0">📤 ${L('Paylaşılabilir görsel','Shareable image')}</h3>${closeBtn()}</div><img src="${url}" style="width:100%;max-width:540px;display:block;margin:12px auto;border-radius:12px">
   <div class="row" style="justify-content:center"><button class="pri" onclick="cardShare('${fname}')">📲 ${L('Paylaş','Share')}</button><a href="${url}" download="${fname}"><button>⬇️ ${L('İndir','Download')}</button></a><button onclick="cardCopy()">📋 ${L('Kopyala','Copy')}</button></div>
