     <td class="num"><b>${money(a.price)}</b>${a.lead?'':'<div class="mut" style="font-size:11px">'+L('başlangıç','start')+'</div>'}</td><td class="num">${a.bids}</td><td class="num">${left<=1?'<span class="rdt">'+L('bugün','today')+'</span>':left+' '+L('gün','d')}</td><td>${aucStatus(a)}</td>
