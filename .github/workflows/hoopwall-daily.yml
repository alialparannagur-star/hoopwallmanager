  ${ys.length?playerTable(ys,v==='stat'?'gen':v,{own:true,wage:p=>money(salary(p.o)),act:p=>`<button class="sm gr" onclick="act('promote',${p.id})">${L('A takıma al','Promote')}</button> <button class="sm rd" onclick="act('yrelease',${p.id})">${L('Gönder','Release')}</button>`}):`<p class="mut">${L('Genç oyuncu yok','No prospects')}</p>`}</div>`;
