  <h3 style="margin-top:14px">🌍 ${L('Uluslararası şampiyonlar','International champions')}</h3>${G.hist.length?`<table>${G.hist.map(h=>`<tr><td>${L('Sezon','Season')} ${h.season}</td><td>${flag(h.ic)} ${esc(h.intl)}</td></tr>`).join('')}</table>`:`<p class="mut">${L('İlk sezon bitince burada görünür.','Appears after the first season.')}</p>`}</div></div>`;
