const OFF_O=()=>[['ins','🏀',L('İçeri oyna','Inside game'),L('Pota altı ve post oyunu. Güçlü uzunlarla etkili; alan savunmasına karşı zayıf.','Post-ups and drives. Great with strong bigs; weak against zone.')],
 ['per','🎯',L('Dış şut','Perimeter'),L('Üçlük ağırlıklı hücum. İyi şutörlerle etkili; alan savunmasını cezalandırır.','Three-point heavy. Great with shooters; punishes zone defense.')],
 ['bal','⚖️',L('Dengeli','Balanced'),L('İçeri-dışarı karışık oyun. Her rakibe karşı güvenli seçim.','Inside-out mix. A safe choice against anyone.')],
 ['trn','⚡',L('Hızlı hücum','Fast break'),L('Daha çok hücum, kolay sayılar. Hızlı oyuncularla etkili; prese karşı iyi.','More possessions, easy buckets. Needs speed; good against the press.')]];
const DEF_O=()=>[['man','🛡️',L('Adam adama','Man-to-man'),L('Standart savunma. Dış ve iç savunmaya eşit dayanır.','Standard defense, relies on perimeter and interior D equally.')],
 ['zone','🧱',L('Alan (2-3)','Zone (2-3)'),L('Potayı kapatır, içeri oynayanları durdurur; iyi şutörlere boşluk verir.','Packs the paint and stops inside teams; leaves shooters open.')],
 ['press','🔥',L('Tam saha pres','Full-court press'),L('Top çalma ve top kaybı artar, oyun hızlanır. Oyuncular yorulur; top kontrolü iyi takımlara karşı riskli.','More steals and turnovers, faster game. Tiring; risky against good ball-handlers.')]];
const offName=k=>(OFF_O().find(o=>o[0]===k)||[])[2],defName=k=>(DEF_O().find(o=>o[0]===k)||[])[2];
function nextOpp(){const tm=todayMatches();return tm.length?tm[0]:null}
function fitOff(k,me,op,TO){const x=me.P,y=op.P;
  return k==='ins'?x.ins-y.idf-(TO.def==='zone'?6:0):k==='per'?x.t3-y.pdf+(TO.def==='zone'?5:0):k==='trn'?(x.spd-y.spd)*1.2+(TO.def==='press'?4:0):((x.ins-y.idf)+(x.t3-y.pdf))/2+1}
function fitDef(k,me,op,TO){const x=me.P,y=op.P;
  return k==='man'?(x.pdf+x.idf)/2-60:k==='zone'?(x.idf-60)-Math.max(0,y.t3-58)*1.5+(TO.off==='ins'?6:0)-(TO.off==='per'?5:0):((x.spd+x.stl)-(y.hnd+y.pas))/2-4}
const fitTag=v=>{const c=v>=3?'grt':v<=-3?'rdt':'mut';return `<span class="${c}" style="font-weight:600">${v>0?'+':''}${v.toFixed(1)} ${v>=3?L('avantaj','edge'):v<=-3?L('dezavantaj','risk'):L('nötr','even')}</span>`};
function setTac(k,v){const T=tac(G.teams[G.user]);T[k]=v;save();render()}
function ensureMin(){const U=G.teams[G.user],T=tac(U);if(!T.min){const lu=lineup(U);T.st=lu.st.slice();T.min={};lu.ids.forEach(id=>T.min[id]=Math.round(lu.m[id]))}
  Object.keys(T.min).forEach(id=>{if(!U.p.includes(+id))delete T.min[id]});return T}
function setMin(id,v){const T=ensureMin();T.min[id]=clamp(Math.round(v)||0,0,MAXMIN);save();render()}
function setStarter(slot,id){const U=G.teams[G.user],T=ensureMin();if(!T.st||T.st.length!==5)T.st=lineup(U).st.slice();
  const prev=T.st.indexOf(id);if(prev>=0)T.st[prev]=T.st[slot];T.st[slot]=id;if(!(T.min[id]>0))T.min[id]=24;save();render()}
function autoRot(){const U=G.teams[G.user],T=tac(U);T.st=autoStarters(U);T.min=autoMinutes(U,T.st);save();render();toast(L('Rotasyon otomatik ayarlandı','Rotation auto-set'))}
