      if(h){if(t.p.length<MAX_ROSTER){t.p.push(id);addNews(t.id,`🎓 ${esc(p.n)} yaş sınırına geldi, A takıma çıktı (3 yıllık sözleşme).`,`🎓 ${esc(p.n)} aged out of the academy and joined the first team (3-year deal).`)}else{p.t=-1;G.fa.push(id);addNews(t.id,`🎓 ${esc(p.n)} yaş sınırını aştı; kadro dolu olduğu için serbest kaldı.`,`🎓 ${esc(p.n)} aged out and left: roster was full.`)}return false}
      if(t.p.length<MAX_ROSTER)t.p.push(id);else{const w=roster(t).slice(-1)[0];if(p.o>w.o){release(t,w.id);t.p.push(id)}else{p.t=-1;G.fa.push(id)}}return false});
