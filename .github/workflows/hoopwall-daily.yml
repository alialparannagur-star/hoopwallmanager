function tesis(){
  const U=G.teams[G.user];
  const cards=FAC.map((f,i)=>{const lv=U.f[i],b=G.builds.find(x=>x.i===i),c=facCost(lv);
    const bar='<div style="display:flex;gap:3px;margin:8px 0">'+Array.from({length:10},(_,k)=>`<div style="flex:1;height:8px;border-radius:3px;background:${k<lv?'var(--or)':(b&&k===lv?'#6b4a22':'var(--panel2)')}"></div>`).join('')+'</div>';
    const btn=lv>=10?`<span class="grt">✔ ${L('Maksimum seviye','Max level')}</span>`:b?`<span class="or">🚧 ${L('İnşaatta','Under construction')} — ${b.left} ${L('gün kaldı','days left')}</span>`:`<button class="${G.money>=c?'pri':''}" onclick="act('build',${i})">${L(`Seviye ${lv+1}'e yükselt`,`Upgrade to level ${lv+1}`)} · ${money(c)} · ${facDays(lv)} ${L('gün','days')}</button>`;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${f.i} ${facName(i)}</h3><span class="big" style="font-size:28px">${lv}<span class="mut" style="font-size:16px">/10</span></span></div>${bar}<p class="mut" style="margin:0 0 10px">${L(f.dtr,f.den)}</p>${btn}</div>`}).join('');
  const rng=Array.from({length:9},(_,k)=>k+1),total=rng.reduce((a,k)=>a+facCost(k),0),days=rng.reduce((a,k)=>a+facDays(k),0);
  return `<div class="card"><h3>🏗️ ${L('Tesisler','Facilities')}</h3><p class="mut">${L(`Tüm tesisler 1. seviyeden başlar, 10'da biter. Her seviye bir öncekinden ~1,75 kat pahalı ve daha uzun sürer. Aynı anda en fazla ${MAX_BUILDS} inşaat. Bir tesisi 1'den 10'a çıkarmak toplam <b>${money(total)}</b> ve <b>${days} gün</b> (~${Math.round(days/30)} sezon) ister.`,`All facilities start at level 1 and max out at 10. Each level costs ~1.75× the previous one and takes longer. Max ${MAX_BUILDS} builds at once. Taking one facility from 1 to 10 costs <b>${money(total)}</b> and <b>${days} days</b> (~${Math.round(days/30)} seasons).`)}</p></div>
  <div class="grid" style="margin-top:14px">${cards}</div>
  <div class="card" style="margin-top:14px"><h3>${L('Seviye maliyet tablosu','Upgrade cost table')}</h3><div class="scroll"><table><tr><th></th>${rng.map(k=>`<th class="num">${k}→${k+1}</th>`).join('')}</tr>
  <tr><td>${L('Ücret','Cost')}</td>${rng.map(k=>`<td class="num">${money(facCost(k))}</td>`).join('')}</tr><tr><td>${L('Süre','Time')}</td>${rng.map(k=>`<td class="num">${facDays(k)} ${L('gün','d')}</td>`).join('')}</tr></table></div></div>`;
}
function tableHtml(st,li,intl){const tier=intl?-1:LEAGUES[li].t;
  return `<div class="scroll"><table><tr><th>#</th><th>${L('Takım','Team')}</th><th class="num">${L('O','GP')}</th><th class="num">${L('G','W')}</th><th class="num">${L('M','L')}</th><th class="num">${L('A','PF')}</th><th class="num">${L('Y','PA')}</th><th class="num">${L('AV','+/-')}</th><th class="num">${L('Güç','Rtg')}</th><th>Form</th></tr>
  ${st.map((t,i)=>{let cls='cl';if(t.id===G.user)cls+=' me';
    if(intl){if(i===0)cls+=' up'}else{if(i===0)cls+=' up';if(tier<2&&i>=14)cls+=' dn'}
    const w=intl?t.iw:t.w,l=intl?t.il:t.lo,pf=intl?t.ipf:t.pf,pa=intl?t.ipa:t.pa;
    return `<tr class="${cls}" onclick="openTeam(${t.id})"><td>${i+1}</td><td>${intl?flag(t.c)+' ':''}${esc(t.name)}${t.id===G.user?' <span class="or">('+L('SEN','YOU')+')</span>':''}</td><td class="num">${w+l}</td><td class="num">${w}</td><td class="num">${l}</td><td class="num">${pf}</td><td class="num">${pa}</td><td class="num">${pf-pa>0?'+':''}${pf-pa}</td><td class="num">${rating(t).toFixed(1)}</td><td>${intl?'':formHtml(t.form)}</td></tr>`}).join('')}</table></div>`}
function leaders(ids){
  const ps=[];ids.forEach(id=>G.teams[id].p.forEach(pid=>{const p=G.P[pid];if(p.g>=3)ps.push(p)}));if(!ps.length)return `<p class="mut">${L('Birkaç maç oynanınca görünür.','Shows up after a few games.')}</p>`;
  const per=(k)=>p=>p.S[k]/p.g,pc=(m,a,min)=>p=>p.S[a]/p.g>=min?p.S[m]/p.S[a]:-1;
  const box_=(lbl,fn,fmt)=>`<div class="card" style="padding:10px"><b class="or">${lbl}</b><table>${ps.map(p=>[p,fn(p)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([p,v])=>`<tr><td>${pName(p)} <span class="mut">${esc(G.teams[p.t].name)}</span></td><td class="num">${fmt(v)}</td></tr>`).join('')}</table></div>`;
  const f1=v=>v.toFixed(1),fp=v=>(v*100).toFixed(1)+'%';
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${box_(L('Sayı','Points'),per(0),f1)}${box_(L('Ribaunt','Rebounds'),per(1),f1)}${box_(L('Asist','Assists'),per(2),f1)}${box_(L('Top Çalma','Steals'),per(3),f1)}${box_(L('Blok','Blocks'),per(4),f1)}${box_(L('Top Kaybı','Turnovers'),per(5),f1)}${box_('FG% (min 5 '+L('atış','FGA')+')',pc(6,7,5),fp)}${box_('2P% (min 4)',p=>(p.S[7]-p.S[9])/p.g>=4?(p.S[6]-p.S[8])/(p.S[7]-p.S[9]):-1,fp)}${box_('3P% (min 2)',pc(8,9,2),fp)}${box_(L('3\'lük isabet','3PM'),per(8),f1)}${box_('FT% (min 2)',pc(10,11,2),fp)}</div>`;
}
const countrySel=(v,on)=>`<select onchange="${on}">${COUNTRIES.map((c,i)=>`<option value="${i}" ${i===v?'selected':''}>${cn(i)}</option>`).join('')}</select>`;
