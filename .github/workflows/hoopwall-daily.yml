  if(!cache||cache.tick!==meta.tick||cache.season!==meta.season||cache.v!==2){
    app().innerHTML=shell(`<div class="card" style="margin-top:30px"><h2>⏳ ${L('Dünya yükleniyor…','Loading the world…')}</h2><p class="mut">${L('20 ülke, 2240 takım. İlk açılış birkaç saniye sürebilir; sonra günde bir kez güncellenir.','20 countries, 2,240 clubs. First load takes a few seconds; afterwards it updates once a day.')}</p></div>`);
    const [cs,gl]=await Promise.all([sb.from('world_country').select('country_id,data').order('country_id'),sb.from('world_global').select('data').eq('id',1).single()]);
    if(cs.error||gl.error)throw new Error((cs.error||gl.error).message);
    cache={v:2,tick:meta.tick,season:meta.season,day:meta.day,countries:cs.data.map(r=>r.data),global:gl.data.data};WCACHE.put(cache);
  }
  assembleWorld(meta,JSON.parse(JSON.stringify(cache.countries)),JSON.parse(JSON.stringify(cache.global)));
  G.user=ME.profile.team_id;const U=myTeam();
  if(!U||!U.m||U.m.uid!==ME.user.id){if(!force)return loadWorldClient(true);throw new Error('team')}
  ['money','builds','board','ach','club','rec','streak','trLog','boxes'].forEach(k=>Object.defineProperty(G,k,{get(){return myTeam().m[k]},set(v){myTeam().m[k]=v},configurable:true}));
  Object.defineProperty(U,'tr',{get(){return U.m.tr},set(v){U.m.tr=v},configurable:true});
  const ord=(await sb.from('team_orders').select('tactics,training').eq('team_id',U.id).maybeSingle()).data;
  if(ord){const s=sanitizeOrders(U,ord);U.tac=s.tac;U.m.tr=s.tr}
  G.auc.forEach(a=>{a.um=a.ub&&a.ub[G.user]?a.ub[G.user][0]:0;a.lead=a.lt===G.user?'u':(a.lt!=null?'b':null);a.bt=a.lt});
  const nw=(await sb.from('news').select('season,day,tr,en').eq('team_id',U.id).order('id',{ascending:false}).limit(150)).data||[];
  G.news=nw.map(r=>({s:r.season,d:r.day,tr:r.tr,en:r.en}));
  await loadWall();
}
async function loadWall(){const U=myTeam();ME.wallKey=U.c+'-'+U.l+'-'+G.season;
  const rows=(await sb.from('wall_messages').select('team_id,body,created_at').eq('league_key',ME.wallKey).order('created_at',{ascending:false}).limit(80)).data||[];
  G.wall={key:ME.wallKey,msgs:rows.map(r=>({s:G.season,d:'',who:r.team_id??-1,tr:esc(r.body),en:esc(r.body),at:r.created_at}))};
  if(!G.wall.msgs.length)G.wall.msgs.push({s:G.season,d:0,who:-1,tr:`${LEAGUES[U.l].k} Ligi ${G.season}. sezon duvarına hoş geldin! Ligdeki diğer menajerlerle buradan konuş. 🏀`,en:`Welcome to the ${LEAGUES[U.l].k} League season ${G.season} wall! Chat with the other managers here. 🏀`})}
function wallCheck(){if(!G.wall)G.wall={key:'',msgs:[]}}
async function sendWall(){const el=document.getElementById('wallIn');const v=(el&&el.value||'').trim().slice(0,300);if(!v)return;
  const {error}=await sb.from('wall_messages').insert({league_key:ME.wallKey,user_id:ME.user.id,team_id:G.user,body:v});if(error)return toast(error.message);await loadWall();render()}

/* ---------- emirler (taktik + antrenman) sunucuya kaydedilir ---------- */
let _ost=null;
function save(){clearTimeout(_ost);_ost=setTimeout(async()=>{const U=myTeam();if(!U)return;
  const {error}=await sb.from('team_orders').upsert({team_id:U.id,user_id:ME.user.id,tactics:U.tac,training:U.m.tr,updated_at:new Date().toISOString()});
  toast(error?L('Kaydedilemedi: ','Save failed: ')+error.message:L('Kaydedildi ✓ (bir sonraki maç gününde uygulanır)','Saved ✓ (applies from the next matchday)'))},700)}
/* henüz sunucuya bağlanmayan işlemler */
function act(){soon()}
function placeBid(){soon()} function startFA(){soon()} function listPlayer(){soon()} function cancelListing(){soon()}
function natCand(){soon()} function natToggle(){soon()} function setNatTac(){soon()} function renameTeam(){soon()}
function go(){}

/* ---------- üst çubuk: sıradaki maç günü ---------- */
function nextMatchAt(){const h=(ME.meta&&ME.meta.match_hour_utc)??17,n=new Date(),t=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),h,0,0));if(t<=n)t.setUTCDate(t.getUTCDate()+1);return t}
function onlineHeader(){const t=nextMatchAt(),ms=t-new Date(),hh=Math.floor(ms/36e5),mm=Math.floor(ms%36e5/6e4);
  const loc=t.toLocaleTimeString(LANG==='tr'?'tr-TR':'en-GB',{hour:'2-digit',minute:'2-digit'});
  return `<span class="pill" title="${L('Maç günleri her gün bu saatte otomatik oynanır','Matchdays play automatically at this time every day')}">⏱ ${G.day>=DAYS?L('Sezon sonu','Off-season'):L('Maç günü','Matchday')} ${loc} · ${hh} ${L('sa','h')} ${mm} ${L('dk','m')}</span><span class="pill">👤 ${esc(ME.profile.username||'')}</span><button class="sm" onclick="logout()">${L('Çıkış','Sign out')}</button>`}
async function checkUpdate(){if(!G||!ME.meta)return;const m=(await sb.from('world_meta').select('tick,season,day').eq('id',1).single()).data;
  if(m&&(m.tick!==ME.meta.tick||m.season!==ME.meta.season)){await loadWorldClient();toast(L('🏀 Yeni maç günü oynandı!','🏀 A new matchday has been played!'));render();if(UI.live&&G.boxes.length)openLive(G.boxes[0],G.boxes.slice(1))}else{const h=document.querySelector('header .hbtn');if(h)h.innerHTML=langBtn()+onlineHeader()}}

/* ---------- açılış ---------- */
async function boot(){if(ME.loading)return;ME.loading=true;
  try{const {data:{session}}=await sb.auth.getSession();if(!session){ME.loading=false;return authScreen()}
    ME.user=session.user;ME.profile=(await sb.from('profiles').select('*').eq('id',ME.user.id).maybeSingle()).data||{};
    if(ME.profile.team_id==null){ME.loading=false;return claimScreen()}
    await loadWorldClient();ME.loading=false;render();
  }catch(e){ME.loading=false;app().innerHTML=shell(`<div class="card" style="margin-top:30px"><h2>⚠️ ${L('Bir sorun oldu','Something went wrong')}</h2><p class="mut">${esc(e.message||e)}</p><button class="pri" onclick="location.reload()">${L('Yeniden dene','Retry')}</button> <button onclick="logout()">${L('Çıkış','Sign out')}</button></div>`)}}
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')recoverScreen()});
function recoverScreen(msg){app().innerHTML=shell(`<div class="card" style="margin-top:30px"><h2>🔑 ${L('Yeni şifre belirle','Set a new password')}</h2><input id="np" type="password" placeholder="${L('Yeni şifre (en az 6)','New password (min 6)')}" style="width:100%;margin:10px 0"><button class="pri" onclick="doRecover()">${L('Kaydet','Save')}</button>${msg?`<p class="rdt">${msg}</p>`:''}</div>`)}
async function doRecover(){const v=document.getElementById('np').value;if(v.length<6)return recoverScreen(L('En az 6 karakter.','At least 6 characters.'));const {error}=await sb.auth.updateUser({password:v});if(error)return recoverScreen(errText(error.message));toast(L('Şifre güncellendi ✓','Password updated ✓'));ME.loading=false;boot()}
setInterval(checkUpdate,60000);
boot();

</script>
</body>
</html>
