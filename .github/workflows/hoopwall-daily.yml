name: Hoopwall mac gunu
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'sim veya init'
        required: true
        default: 'sim'
        type: choice
        options:
          - sim
          - init
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuyu cagir
        run: |
          ACTION="${{ github.event.inputs.action || 'sim' }}"
          curl -sS --fail-with-body --max-time 150 -X POST "${{ secrets.HW_FN_URL }}" -H "Content-Type: application/json" -H "x-admin-token: ${{ secrets.HW_ADMIN_TOKEN }}" -d "{\"action\":\"$ACTION\"}"
