    ${opp?`<h3 style="margin-top:12px">${L('Rakibin tehlikeli oyuncuları','Opponent threats')}</h3><table>${oppTop.map(([p,v])=>`<tr><td>${pName(p)} <span class="mut">${p.pos} · OVR ${p.o}</span></td><td class="num">${p.g?v.toFixed(1)+' '+L('sayı','ppg'):''}</td><td><button class="sm ${T.stop===p.id?'pri':''}" onclick="setTac('stop',${T.stop===p.id?'null':p.id})">${T.stop===p.id?'✔ '+L('Özel savunmada','Locked down'):L('Özel savunma','Lock down')}</button></td></tr>`).join('')}</table>
    <p class="mut" style="font-size:12px">${L('Özel savunma: seçtiğin oyuncuya çift adam gidilir; onun sayıları düşer ama diğerleri biraz boş kalır. Yıldıza karşı kullan.','Lock-down: the player gets doubled; his scoring drops but others get a bit more space. Use it on stars.')}</p>`:''}</div>
   <div class="card"><h3>⚔️ ${L('Hücum sistemi','Offense')}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px">${OFF_O().map(([k,ic,n,d])=>card(T.off===k,k,ic,n,d,op?fitOff(k,me,op,TO):0,`setTac('off','${k}')`)).join('')}</div>
    <h3 style="margin-top:14px">⏱ ${L('Tempo','Pace')}</h3>${seg('tempo',[[0,L('Yavaş','Slow')],[1,L('Normal','Normal')],[2,L('Hızlı','Fast')]])}<p class="mut" style="font-size:12px">${L('Hızlı tempo daha çok hücum demek: güçlü takım farkı açar, zayıf takım için risklidir. Yavaş tempo güçlü rakibe karşı maçı yakın tutar.','Fast pace = more possessions: favorites pull away, underdogs suffer. Slow pace keeps games close against stronger teams.')}</p>
    <h3 style="margin-top:10px">⭐ ${L('Go-to oyuncu (kilit skorer)','Go-to scorer')}</h3><select onchange="setTac('star',this.value===''?null:+this.value)"><option value="">${L('Yok — top paylaşılsın','None — share the ball')}</option>${ps.map(p=>`<option value="${p.id}" ${T.star===p.id?'selected':''}>${esc(p.n)} (${p.pos}, OVR ${p.o})</option>`).join('')}</select>
    <p class="mut" style="font-size:12px">${L('Seçtiğin oyuncu %40 daha fazla şut kullanır. Takımın en iyisiyse işe yarar, değilse zarar verir.','Takes 40% more shots. Helps if he\'s your best player, hurts if not.')}</p></div>
   <div class="card"><h3>🛡️ ${L('Savunma sistemi','Defense')}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px">${DEF_O().map(([k,ic,n,d])=>card(T.def===k,k,ic,n,d,op?fitDef(k,me,op,TO):0,`setTac('def','${k}')`)).join('')}</div>
    <h3 style="margin-top:14px">💪 ${L('Sertlik','Aggression')}</h3>${seg('agg',[[0,L('Yumuşak','Soft')],[1,L('Normal','Normal')],[2,L('Sert','Physical')]])}<p class="mut" style="font-size:12px">${L('Sert savunma rakibin isabetini düşürür, top çalmayı artırır ama rakip çok daha fazla serbest atış kullanır.','Physical D lowers opponent efficiency and adds steals, but sends them to the line much more.')}</p>
    <h3 style="margin-top:10px">🏀 ${L('Ribaunt stratejisi','Rebounding')}</h3>${seg('reb',[[0,L('Geri dön','Get back')],[1,L('Dengeli','Balanced')],[2,L('Hücum ribauntuna git','Crash the glass')]])}<p class="mut" style="font-size:12px">${L('Hücum ribauntu ikinci şans sayısı getirir ama rakibe hızlı hücum fırsatı verir. Geri dön, rakibin kolay sayılarını keser.','Crashing gives second-chance points but allows fast breaks. Getting back kills easy opponent buckets.')}</p></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🔄 ${L('Rotasyon & dakikalar','Rotation & minutes')}</h3><div class="row"><span class="${tot===GAME_MIN?'grt':'rdt'}" style="font-weight:600">${L('Toplam','Total')}: ${tot}/${GAME_MIN} ${L('dk','min')}</span><button class="sm pri" onclick="autoRot()">⚙️ ${L('Otomatik ayarla','Auto-set')}</button></div></div>
   <p class="mut">${L('FIBA kuralı: 4 çeyrek × 10 dakika. 5 oyuncu × 40 dakika = 200 dakika dağıtılır; toplam 200 değilse maçta oranlanarak düzeltilir. 30 dakikanın üstünde oynayan oyuncu yorulur ve verimi düşer. Mevkisi dışında ilk beşte oynayan oyuncu ceza alır.','FIBA rules: 4 quarters × 10 minutes. 5 players × 40 = 200 minutes to share; if the total differs it\'s scaled at tip-off. Players above 30 minutes tire and lose efficiency. Starters out of position get a penalty.')}</p>
   <h3>${L('İlk beş','Starting five')}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px">${POS.map((slot,i)=>{const cur=G.P[st[i]],d=cur?Math.abs(POS.indexOf(cur.pos)-i):0;
     return `<div class="card" style="padding:10px"><b class="or">${slot}</b><select style="width:100%;margin-top:6px" onchange="setStarter(${i},+this.value)">${ps.map(p=>`<option value="${p.id}" ${p.id===st[i]?'selected':''}>${esc(p.n)} · ${p.pos} · ${p.o}</option>`).join('')}</select>${d>=2?`<div class="rdt" style="font-size:12px;margin-top:4px">⚠️ ${L('Mevki dışı','Out of position')} (-${SLOT_PEN[d]})</div>`:''}</div>`}).join('')}</div>
   <div class="scroll" style="margin-top:12px"><table><tr><th>${L('Rol','Role')}</th><th>${L('Oyuncu','Player')}</th><th>${L('Poz','Pos')}</th><th class="num">OVR</th><th class="num">${L('Dakika','Minutes')}</th><th></th><th>${L('Durum','Status')}</th></tr>
   ${ps.slice().sort((a,b)=>{const ia=st.indexOf(a.id),ib=st.indexOf(b.id);if(ia>=0||ib>=0)return (ia<0?9:ia)-(ib<0?9:ib);return b.o-a.o||a.id-b.id}).map(p=>{const m=curMin(p.id),role=st.includes(p.id)?`<span class="pill" style="color:var(--or)">${L('İlk 5','Starter')}</span>`:m>=12?`<span class="pill">${L('Rotasyon','Rotation')}</span>`:m>0?`<span class="pill">${L('Az süre','Spot')}</span>`:`<span class="pill mut">${L('Kulübe','Bench')}</span>`;
     return `<tr><td>${role}</td><td>${pName(p)}</td><td>${p.pos}</td><td class="num">${ovrTag(p.o)}</td><td class="num" style="white-space:nowrap"><button class="sm" onclick="setMin(${p.id},${m-2})">−</button> <input type="number" min="0" max="40" value="${m}" style="width:56px;text-align:center;padding:4px" onchange="setMin(${p.id},+this.value)"> <button class="sm" onclick="setMin(${p.id},${m+2})">+</button></td>
       <td style="width:22%"><div style="height:8px;background:var(--panel2);border-radius:4px"><div style="height:8px;width:${m/MAXMIN*100}%;background:${m>VTIRED?'var(--rd)':m>TIRED?'#e6a23c':'var(--or)'};border-radius:4px"></div></div></td>
       <td style="font-size:12px">${m>VTIRED?'<span class="rdt">🥵 '+L('Çok yorulur','Heavy fatigue')+'</span>':m>TIRED?'<span style="color:#e6a23c">😓 '+L('Yorulur','Tired')+'</span>':m>0?'<span class="grt">✔</span>':''}</td></tr>`}).join('')}</table></div></div>`;
}

/* ================= ANTRENMAN EKRANI ================= */
function setTr(k,v){const U=G.teams[G.user];if(!U.tr)U.tr={f:'gen',i:1,ind:{}};U.tr[k]=v;save();render()}
function setInd(pid,v){const U=G.teams[G.user];if(!U.tr)U.tr={f:'gen',i:1,ind:{}};if(v==='')delete U.tr.ind[pid];else U.tr.ind[pid]=+v;save();render()}
function antrenman(){
  const U=G.teams[G.user];if(!U.tr)U.tr={f:'gen',i:1,ind:{}};const T=U.tr,grp=TRAIN.find(x=>x.k===T.f),ps=roster(U).concat(U.y.map(id=>G.P[id]).sort((a,b)=>b.pt-a.pt));
  const lv=U.f[1],base=(.7+.06*lv)*[.6,1,1.4][T.i]*.06;
  const card=t=>`<div class="ccard ${T.f===t.k?'on':''}" style="text-align:left;padding:12px" onclick="setTr('f','${t.k}')"><div class="row" style="justify-content:space-between"><b>${t.i} ${L(t.tr,t.en)}</b>${T.f===t.k?'<span class="or">✔</span>':''}</div><div class="mut" style="font-size:12px;margin-top:6px">${t.k==='gen'?L('Tüm özellikler biraz gelişir','All attributes improve a little'):t.a.map(aName).join(', ')}</div></div>`;
  const rows=ps.map(p=>{const d=p.o-(p.o0??p.o),ind=T.ind[p.id],g=base*trAge(p.a)*(p.o>=p.pt?.15:1);
    const focus=(ind!=null?[ind]:[]).concat(grp.a.slice(0,3)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
    return `<tr><td>${pName(p)}${p.y?' <span class="mut">🌱</span>':''}</td><td>${p.pos}</td><td class="num">${p.a}</td><td class="num">${ovrTag(p.o)} ${d?`<span class="${d>0?'grt':'rdt'}" style="font-size:12px">${d>0?'+':''}${d}</span>`:''}</td><td class="num">${ovrTag(p.pt)}</td>
     <td><div style="height:8px;background:var(--panel2);border-radius:4px;width:70px"><div style="height:8px;width:${Math.min(100,trAge(p.a)/2*100)}%;background:${p.o>=p.pt?'var(--mut)':'var(--gr)'};border-radius:4px"></div></div><span class="mut" style="font-size:11px">${p.o>=p.pt?L('Tavanda','At ceiling'):trAge(p.a)>=1.3?L('Hızlı','Fast'):trAge(p.a)>=.9?L('Normal','Normal'):L('Yavaş','Slow')}</span></td>
     <td><select style="padding:3px" onchange="setInd(${p.id},this.value)"><option value="">${L('— Takım odağı —','— Team focus —')}</option>${ATTR.map((a,i)=>`<option value="${i}" ${ind===i?'selected':''}>${aName(i)} (${p.at[i]})</option>`).join('')}</select></td>
     <td style="font-size:12px">${focus.map(i=>`<div style="display:flex;gap:6px;align-items:center"><span style="width:62px">${aShort(i)} ${p.at[i]}</span><div style="flex:1;min-width:50px;height:6px;background:var(--panel2);border-radius:3px"><div style="height:6px;width:${Math.round(((p.tp||[])[i]||0)*100)}%;background:var(--or);border-radius:3px"></div></div></div>`).join('')}</td>
     <td class="num mut" style="font-size:12px">${g>0?'~'+Math.max(1,Math.round(1/(g*(T.f==='gen'?.3:1)+(ind!=null?g*.6:0)))):'–'} ${L('gün','d')}</td></tr>`}).join('');
  const log=G.trLog.filter(x=>G.P[x.pid]&&G.P[x.pid].t===G.user).slice(0,15);
  return `<div class="card"><h3>🏋️ ${L('Antrenman','Training')}</h3><p class="mut">${L(`Oyuncular her gün antrenman yapar ve seçtiğin alanlarda yavaş yavaş gelişir. Gençler çok hızlı, 30 yaş üstü çok yavaş gelişir. Potansiyel (POT) tavanına ulaşan oyuncu neredeyse hiç gelişmez. Antrenman Tesisi seviyen: <b>${lv}</b> (her seviye +%6 hız).`,`Players train every day and slowly improve in the areas you choose. Youngsters improve fast, 30+ players very slowly. Players at their potential (POT) barely improve. Training Center level: <b>${lv}</b> (+6% speed per level).`)}</p></div>
  <div class="grid" style="margin-top:14px"><div class="card"><h3>${L('Takım odağı','Team focus')}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">${TRAIN.map(card).join('')}</div></div>
   <div class="card"><h3>${L('Yoğunluk','Intensity')}</h3><div class="row" style="gap:4px">${[[0,L('Hafif','Light')],[1,L('Normal','Normal')],[2,L('Yoğun','Intense')]].map(([v,t])=>`<button class="${T.i===v?'pri':''}" onclick="setTr('i',${v})">${t}</button>`).join('')}</div>
    <table style="margin-top:10px"><tr><th></th><th class="num">${L('Gelişim','Growth')}</th><th class="num">${L('Maç gücü','Match rating')}</th></tr><tr><td>${L('Hafif','Light')}</td><td class="num">%60</td><td class="num grt">+0.5</td></tr><tr><td>Normal</td><td class="num">%100</td><td class="num">0</td></tr><tr><td>${L('Yoğun','Intense')}</td><td class="num grt">%140</td><td class="num rdt">−1.5</td></tr></table>
    <p class="mut" style="font-size:12px">${L('Yoğun antrenman oyuncuları hızlı geliştirir ama yorar, maçlarda biraz düşük oynarlar. Önemli maç öncesi hafife, boş haftada yoğuna almak iyi bir taktiktir.','Intense training develops players faster but tires them for games. Go light before big games, intense in quiet weeks.')}</p></div></div>
  <div class="card" style="margin-top:14px"><h3>${L('Bireysel gelişim planı','Individual development plan')}</h3><p class="mut">${L('Bir oyuncuya özel bir özellik seçersen o özellik takım odağına ek olarak ekstra hızlı gelişir. Çubuklar bir sonraki +1 puana ne kadar kaldığını gösterir. OVR yanındaki sayı bu sezonki değişim.','Pick a personal attribute and it grows extra fast on top of the team focus. Bars show progress to the next +1. The number next to OVR is this season\'s change.')}</p>
   <div class="scroll"><table><tr><th>${L('Oyuncu','Player')}</th><th>${L('Poz','Pos')}</th><th class="num">${L('Yaş','Age')}</th><th class="num">OVR</th><th class="num">POT</th><th>${L('Gelişim hızı','Growth rate')}</th><th>${L('Özel odak','Personal focus')}</th><th>${L('İlerleme','Progress')}</th><th class="num">+1 ${L('için','in')}</th></tr>${rows}</table></div></div>
  <div class="card" style="margin-top:14px"><h3>📈 ${L('Son gelişmeler','Recent improvements')}</h3>${log.length?`<table>${log.map(x=>{const p=G.P[x.pid];return `<tr><td class="mut">S${x.s} ${L('G','D')}${x.d}</td><td>${pName(p)}</td><td>${aName(x.i)} <b class="grt">${x.v-1} → ${x.v}</b></td><td>${x.o1>x.o0?`<span class="or">OVR ${x.o0} → <b>${x.o1}</b></span>`:''}</td></tr>`}).join('')}</table>`:`<p class="mut">${L('Birkaç gün antrenman yapınca burada görünür.','Shows up after a few days of training.')}</p>`}</div>`;
}
/* ================= YÖNETİM KARTI ================= */
function boardCard(){if(!G.board)return '';const c=G.board.conf,col=c>=60?'var(--gr)':c>=30?'#e6a23c':'var(--rd)',tier=LEAGUES[G.teams[G.user].l].t;
  return `<div class="card"><h3>🎯 ${L('Yönetim hedefleri','Board objectives')}</h3><div class="row" style="justify-content:space-between"><span>${L('Yönetim güveni','Board confidence')}</span><b style="color:${col}">%${c}</b></div>
   <div style="height:8px;background:var(--panel2);border-radius:4px;margin:6px 0 10px"><div style="height:8px;width:${c}%;background:${col};border-radius:4px"></div></div>
   <table>${G.board.obj.map(o=>{const s=objState(o);return `<tr><td>${s.ok?(s.final?'✅':'🟢'):(s.final?'❌':'⏳')}</td><td>${objText(o)}</td><td class="num mut" style="font-size:12px">${s.cur}</td></tr>`}).join('')}</table>
   <p class="mut" style="font-size:12px">${L(`Sezon sonunda tutan her hedef +${money([300000,120000,50000][tier])} ve güven artışı getirir. Güven sıfıra düşerse kovulursun.`,`Each objective met pays +${money([300000,120000,50000][tier])} and raises confidence at season end. Hit zero and you're sacked.`)}</p></div>`}
/* ================= MİLLİ TAKIM EKRANI ================= */
function milli(){
  const N=G.nat,W=N.wc,uc=G.teams[G.user].c,coach=N.coach[uc]===G.user;if(UI.nc==null)UI.nc=uc;const vc=UI.nc;
  const RN=d=>d+1;const sl=(t)=>t?`<td class="num"><b>${t[2]!=null?scoreLink(t[2]+' – '+t[3],t[4]):'vs'}</b></td>`:'';
  const tie=t=>t?`<tr><td>${flag(t[0])} ${cn(t[0])}</td>${sl(t)}<td>${flag(t[1])} ${cn(t[1])}</td></tr>`:'';
  const groups=W.groups.map((g,gi)=>`<div class="card" style="padding:10px"><b class="or">${L('Grup','Group')} ${'ABCD'[gi]}</b><table><tr><th>${L('Ülke','Country')}</th><th class="num">${L('G','W')}</th><th class="num">${L('M','L')}</th><th class="num">${L('AV','+/-')}</th></tr>${gStand(gi).map((ci,i)=>{const T=W.tab[ci];return `<tr class="${ci===uc?'me':''} ${i<2?'up':''}"><td>${flag(ci)} ${cn(ci)}</td><td class="num">${T.w}</td><td class="num">${T.l}</td><td class="num">${T.pf-T.pa>0?'+':''}${T.pf-T.pa}</td></tr>`}).join('')}</table>
    <div style="font-size:12px;margin-top:6px">${W.gres[gi].map((rd,r)=>rd?rd.map((x,k)=>x?`<div class="row" style="justify-content:space-between;gap:4px"><span>${flag(g[W.fx[r][k][0]])} ${flag(g[W.fx[r][k][1]])}</span><span>${scoreLink(x[0]+'-'+x[1],x[2])}</span></div>`:'').join(''):'').join('')}</div></div>`).join('');
  const nt=natT(vc),ps=nt.p.map(id=>G.P[id]).filter(Boolean).sort((a,b)=>b.o-a.o);
  const nextDay=[...NAT_G,NAT_QF,NAT_SF,NAT_F].find(d=>d>=G.day);
  let coachBox='';
  if(coach)coachBox=`<div class="card" style="margin-top:14px"><h3>🧑‍🏫 ${L('Hoca paneli','Coach panel')} — ${flag(uc)} ${cn(uc)} <span class="mut">(${L('kalan görev','term left')}: ${N.term[uc]} ${L('sezon','season(s)')})</span></h3>
    <div class="row" style="gap:16px"><div><span class="mut">${L('Hücum','Offense')}</span> ${OFF_O().map(([k,ic,n])=>`<button class="sm ${(N.utac[uc]||DEF_TAC).off===k?'pri':''}" onclick="setNatTac('off','${k}')">${ic} ${n}</button>`).join(' ')}</div>
    <div><span class="mut">${L('Savunma','Defense')}</span> ${DEF_O().map(([k,ic,n])=>`<button class="sm ${(N.utac[uc]||DEF_TAC).def===k?'pri':''}" onclick="setNatTac('def','${k}')">${ic} ${n}</button>`).join(' ')}</div>
    <div><span class="mut">${L('Tempo','Pace')}</span> ${[0,1,2].map(v=>`<button class="sm ${(N.utac[uc]||DEF_TAC).tempo===v?'pri':''}" onclick="setNatTac('tempo',${v})">${[L('Yavaş','Slow'),'Normal',L('Hızlı','Fast')][v]}</button>`).join(' ')}</div></div>
    <p class="mut">${L(`Kadroya ${(N.usq[uc]||N.sq[uc]).length}/12 oyuncu seçili. ${flag(uc)} uyruklu en iyi 30 oyuncudan seç (8–12 kişi).`,`${(N.usq[uc]||N.sq[uc]).length}/12 players selected. Choose from the 30 best ${flag(uc)} players (8–12).`)}</p>
    <div class="scroll"><table><tr><th></th><th>${L('Oyuncu','Player')}</th><th>${L('Poz','Pos')}</th><th class="num">${L('Yaş','Age')}</th><th class="num">OVR</th><th>${L('Kulüp','Club')}</th></tr>${(N.pool[uc]||[]).map(id=>G.P[id]).filter(Boolean).map(p=>{const inSq=(N.usq[uc]||N.sq[uc]).includes(p.id);return `<tr ${inSq?'class="me"':''}><td><input type="checkbox" ${inSq?'checked':''} onchange="natToggle(${p.id})"></td><td>${pName(p)}</td><td>${p.pos}</td><td class="num">${p.a}</td><td class="num">${ovrTag(p.o)}</td><td class="mut">${p.t>=0?esc(G.teams[p.t].name)+' · '+lgF(G.teams[p.t].c,G.teams[p.t].l):''}</td></tr>`}).join('')}</table></div></div>`;
  return `<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3 style="margin:0">🌐 ${L('Milli Takımlar & Milletler Kupası','National Teams & Nations Cup')}</h3><div class="mut">${L('Her ülkenin milli takımı, o uyruktaki en iyi 12 oyuncudan oluşur. 20 ülke 4 gruba ayrılır, ilk ikiler çeyrek finale kalır. Maçlar 5, 9, 13, 17, 21 (grup), 24 (çeyrek), 26 (yarı) ve 29. günlerde (final). Kulüp istatistiklerini etkilemez.','Each national team is the best 12 players of that nationality. 20 nations in 4 groups, top two reach the quarter-finals. Games on days 5, 9, 13, 17, 21 (groups), 24 (QF), 26 (SF) and 29 (final). Club stats are not affected.')}</div></div>
   <div style="min-width:240px">${coach?`<div class="pill or">🧑‍🏫 ${L('Sen milli takım hocasısın','You are the national coach')}</div>`:N.coach[uc]!=null?'':myTeam().m.cand?`<div class="pill">🗳️ ${L('Adaysın — seçim sezon sonunda','Candidate — vote at season end')}</div>`:`<button class="pri" onclick="natCand()">🗳️ ${flag(uc)} ${L('Milli takım hocalığına aday ol','Run for national coach')}</button><div class="mut" style="font-size:12px;margin-top:4px">${L('Kazanma şansın yönetim güvenine, ligine ve kupalarına bağlı. Görev 2 sezon.','Chance depends on board confidence, league level and trophies. 2-season term.')}</div>`}</div></div>
   ${W.champ!=null?`<div class="big" style="margin-top:10px">🏆 ${flag(W.champ)} ${cn(W.champ)}</div>`:`<p>${L('Sıradaki milli maç günü','Next national matchday')}: <b>${nextDay!=null?L('Gün ','Day ')+RN(nextDay):'–'}</b></p>`}</div>
  ${W.qf?`<div class="card" style="margin-top:14px"><h3>${L('Eleme turu','Knockout stage')}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><div><b class="or">${L('Çeyrek final','Quarter-finals')}</b><table>${W.qf.map(tie).join('')}</table></div><div><b class="or">${L('Yarı final','Semi-finals')}</b><table>${(W.sf||[]).map(tie).join('')||'<tr><td class="mut">–</td></tr>'}</table></div><div><b class="or">${L('Final','Final')}</b><table>${(W.f||[]).map(tie).join('')||'<tr><td class="mut">–</td></tr>'}</table></div></div></div>`:''}
  <div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${groups}</div>
