<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoopwall Manager — Basketball Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1116;--panel:#171c24;--panel2:#1f2632;--line:#2a3342;--txt:#e8ecf2;--mut:#8b97a8;--or:#ff7a1a;--or2:#ffb066;--gr:#2ecc71;--rd:#e74c3c;--bl:#4aa3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;margin:0 0 10px}
h2{font-size:24px}h3{font-size:19px;color:var(--or2)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--panel2);color:var(--txt)}
button:hover{filter:brightness(1.2)}
button.pri{background:var(--or);color:#111;font-weight:600}
button.sm{padding:4px 9px;font-size:12px}
button.gr{background:#1d6b42}button.rd{background:#7a2a22}
select,input{font:inherit;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#1a1208,#0e1116 60%);border-bottom:2px solid var(--or);padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.logo{font-family:'Barlow Condensed';font-weight:800;font-size:26px;letter-spacing:1px}
.logo b{color:var(--or)}
.hinfo{display:flex;gap:14px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.hinfo strong{color:var(--txt)}
.hbtn{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav{display:flex;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;color:var(--mut);white-space:nowrap}
nav button.on{color:var(--or);background:var(--panel2)}
main{padding:16px;max-width:1200px;margin:0 auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid #1e2530}
tr.me td{background:#3a250f}
tr.up td:first-child{border-left:3px solid var(--gr)}
tr.dn td:first-child{border-left:3px solid var(--rd)}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.or{color:var(--or)}.grt{color:var(--gr)}.rdt{color:var(--rd)}
.ovr{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:1px 5px;font-weight:600;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--panel2);font-size:12px;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{font-family:'Barlow Condensed';font-size:40px;font-weight:800}
.ccard{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:14px;cursor:pointer;text-align:center}
.ccard:hover,.ccard.on{border-color:var(--or)}
.ccard .f{font-size:38px}
.news li{margin-bottom:6px}
.overlay{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--or);border-radius:14px;padding:18px;max-width:820px;width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--or);color:#111;padding:10px 18px;border-radius:10px;font-weight:600;display:none;z-index:30}
.tree{display:grid;gap:8px;text-align:center}
.tree .lv{display:grid;gap:8px}
.tree span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;font-weight:600}
.tree .a span{border-color:var(--or);color:var(--or)}
.scroll{overflow-x:auto}
@media(max-width:600px){.hbtn{margin-left:0}main{padding:10px}}
</style>
</head>

const pick=a=>a[Math.floor(Math.random()*a.length)];

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('hoopwall',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 get(){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('s').objectStore('s').get('game');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 put(v){if(!this.db)return;try{this.db.transaction('s','readwrite').objectStore('s').put(v,'game')}catch(e){}},
 del(){if(!this.db)return;try{this.db.transaction('s','readwrite').objectStore('s').delete('game')}catch(e){}}};

function salary(o){return Math.max(1500,Math.round(1000*Math.pow(1.13,o-40)/500)*500)}   // sezonluk
function value(p){const f=p.a<=21?1.8:p.a<=24?1.4:p.a<=29?1:p.a<=32?.6:.3;const pot=p.a<=24?(p.pt-p.o)*.15:0;return Math.max(5000,Math.round(Math.pow(Math.max(0,p.o-38+pot),2)*300*f/1000)*1000)}
function newPlayer(ci,tier,youth,yb=0,pos){
  const nat=Math.random()<.82?ci:rnd(0,COUNTRIES.length-1),N=COUNTRIES[nat];
  const p={id:G.nid++,n:pick(N.first)+' '+pick(N.last),nat,pos:pos||pick(POS),t:-1,y:!!youth,g:0,S:newS(),s:0,c:0};
  let o;if(youth){p.a=rnd(16,19);o=rnd(34,50)+(2-tier)*2+yb}else{p.a=rnd(19,34);o=clamp(Math.round(TIER_BASE[tier]+gauss()*6),30,92)}
  makeAttrs(p,o);
  if(youth)p.pt=clamp(p.o+rnd(15,42)+Math.round(yb*1.5),50,97);else{p.pt=p.a<24?clamp(p.o+rnd(3,18),p.o,96):p.o;p.s=salary(p.o);p.c=rnd(1,4)}
  G.P[p.id]=p;return p;
}
function income(t){return Math.round(INCOME[LEAGUES[t.l].t]*(1+.15*(t.f[0]-1)))}
function payroll(t){return t.p.reduce((x,id)=>x+G.P[id].s,0)}
function scoutLv(){return G.teams[G.user].f[4]}
function scoutPot(p){const l=scoutLv();if(l<3)return '<span class="mut">?</span>';if(l>=9)return ovrTag(p.pt);const w=l>=6?4:8;return `<span class="mut">${Math.max(p.o,p.pt-w)}–${p.pt+w}</span>`}
const disc=()=>1-.02*(scoutLv()-1);
const signBonus=p=>Math.round(value(p)*.4*disc()/1000)*1000;

function teamNames(c,n){const all=[];c.cities.forEach(ci=>c.nick.forEach(nk=>all.push(ci+' '+nk)));return shuffle(all).slice(0,n)}
function newTeam(name,ci,li){
  const t={id:G.teams.length,name,c:ci,l:li,p:[],y:[],w:0,lo:0,pf:0,pa:0,iw:0,il:0,ipf:0,ipa:0,tempo:1,focus:0,form:[],f:[1,1,1,1,1]};
  G.teams.push(t);const tier=LEAGUES[li].t,size=rnd(13,15);
  for(let i=0;i<size;i++){const p=newPlayer(ci,tier,false,0,POS[i%5]);p.t=t.id;t.p.push(p.id)}
  for(let i=0,n=rnd(3,5);i<n;i++){const p=newPlayer(ci,tier,true);p.t=t.id;t.y.push(p.id)}
  return t;
}
function makeFixtures(n){const arr=[...Array(n).keys()],R=[];
  for(let r=0;r<n-1;r++){const rd=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if(r%2&&i===0)[h,a]=[a,h];rd.push([h,a])}R.push(rd);arr.splice(1,0,arr.pop())}
  return R.concat(R.map(rd=>rd.map(([h,a])=>[a,h])))}
function genWorld(){
  G={v:VERSION,bx:{},bxN:0,season:1,day:0,teams:[],P:{},nid:0,fa:[],news:[],user:null,money:0,countries:[],intl:null,boxes:[],hist:[],builds:[],neg:false};
  COUNTRIES.forEach((c,ci)=>{const names=teamNames(c,112);let k=0;
    const leagues=LEAGUES.map((_,li)=>{const ids=[];for(let i=0;i<16;i++)ids.push(newTeam(names[k++],ci,li).id);return {teams:ids,fx:makeFixtures(16),res:[]}});
    G.countries.push({leagues,cup:null});
    for(let i=0;i<25;i++)G.fa.push(newPlayer(ci,rnd(1,2),false).id);
    setupCup(ci);
  });
  setupIntl(G.countries.map(c=>c.leagues[0].teams.map(id=>G.teams[id]).sort((a,b)=>rating(b)-rating(a))[0].id));
}
function setupIntl(ids){const n=ids.length,m=n%2?n+1:n,fx=makeFixtures(m).slice(0,m-1);
  G.intl={teams:shuffle(ids.slice()),n,fx,res:[],days:fx.map((_,r)=>Math.floor(r*DAYS/fx.length))};
  G.intl.teams.forEach(id=>{const t=G.teams[id];t.iw=t.il=t.ipf=t.ipa=0})}
const intlTeam=i=>i<G.intl.n?G.teams[G.intl.teams[i]]:null;

/* ÜLKE KUPASI: 112 takım; A Ligi 16 takımı 1. turu bay geçer → 64 → 32 → 16 → 8 → 4 → 2 → şampiyon */
function cupTie(a,b){const A=G.teams[a],B=G.teams[b];let h=a,w=b;if(B.l>A.l||(B.l===A.l&&Math.random()<.5)){h=b;w=a}return [h,w,null,null]}
function pairUp(ids){shuffle(ids);const t=[];for(let i=0;i<ids.length;i+=2)t.push(cupTie(ids[i],ids[i+1]));return t}
function setupCup(ci){const C=G.countries[ci],rest=[];for(let li=1;li<7;li++)rest.push(...C.leagues[li].teams);
  C.cup={r:0,ties:pairUp(rest),byes:C.leagues[0].teams.slice(),done:[],champ:null}}
function playCupRound(ci,r){
  const C=G.countries[ci],K=C.cup;if(K.champ!==null||K.r!==r)return;
  const win=[];K.ties.forEach(t=>{const res=playMatch(t[0],t[1],2);t[2]=res[0];t[3]=res[1];t[4]=res[5];const w=res[0]>res[1]?t[0]:t[1],l=w===t[0]?t[1]:t[0];win.push(w);
    if(w===G.user){const pr=CUP_PRIZE[r];G.money+=pr;addNews(r===6?`🏆 <b>KUPA ŞAMPİYONU OLDUN!</b> +${money(pr)}`:`🏆 Kupada ${CUP_TR[r]} geçildi! +${money(pr)}`,r===6?`🏆 <b>YOU WON THE CUP!</b> +${money(pr)}`:`🏆 Cup: through the ${CUP_EN[r]}! +${money(pr)}`)}
    if(l===G.user)addNews(`❌ Kupaya ${CUP_TR[r]} turunda veda ettin.`,`❌ Knocked out of the cup in the ${CUP_EN[r]}.`)});
  K.done.push(K.ties);
  let next=win;if(r===0)next=win.concat(K.byes);
  if(next.length===1){K.champ=next[0];K.ties=[];if(ci===G.teams[G.user].c)addNews(`🏆 ${flag(ci)} Kupa şampiyonu: <b>${esc(G.teams[next[0]].name)}</b>`,`🏆 ${flag(ci)} Cup winner: <b>${esc(G.teams[next[0]].name)}</b>`)}
  else K.ties=pairUp(next);
  K.r++;
}

const roster=t=>t.p.map(id=>G.P[id]).sort((a,b)=>b.o-a.o);
function rating(t){const ps=roster(t),w=[1,1,1,1,1,.75,.6,.45,.3,.2];let s=0,ws=0;for(let i=0;i<10;i++){s+=(ps[i]?ps[i].o:30)*w[i];ws+=w[i]}return s/ws}
function box(t,pts){
  const ps=roster(t).slice(0,10),mins=[34,32,30,28,26,22,18,14,10,6],A=(p,k)=>p.at[AI[k]],J=()=>.7+Math.random()*.6;
  const ws=ps.map((p,i)=>mins[i]*Math.pow(p.o/70,2)*POSF[p.pos].s*(.65+Math.random()*.7));
  const W={r:ps.map((p,i)=>mins[i]*Math.pow((A(p,'REB')*.7+A(p,'STR')*.3)/60,2)*J()),a:ps.map((p,i)=>mins[i]*Math.pow(A(p,'PAS')/60,2.5)*J()),
    st:ps.map((p,i)=>mins[i]*Math.pow(A(p,'STL')/60,3)*Math.random()),bl:ps.map((p,i)=>mins[i]*Math.pow((A(p,'IDF')+A(p,'JMP'))/120,4)*Math.random()),
    to:ps.map((p,i)=>(ws[i]+mins[i]*.4)*(75/A(p,'HND'))*Math.random())};
  const T={r:rnd(34,46),a:rnd(16,28),st:rnd(4,11),bl:rnd(2,7),to:rnd(9,17)},sum=a=>a.reduce((x,y)=>x+y,0)||1,SW={};Object.keys(W).forEach(k=>SW[k]=sum(W[k]));const sw=sum(ws);
  let left=pts;const lines=[];
  ps.forEach((p,i)=>{let v=i===ps.length-1?left:Math.round(pts*ws[i]/sw);v=Math.max(0,Math.min(v,left));left-=v;
    const q=k=>Math.round(T[k]*W[k][i]/SW[k]);
    const t3=A(p,'3PT'),fi=(A(p,'FIN')+A(p,'MID'))/2,ftA=A(p,'FT');
    let ftm=Math.min(v,Math.round(v*clamp(.06+(A(p,'FIN')+A(p,'STR')-100)/700,.03,.25)*(.6+Math.random()*.8)));
    const r=v-ftm,sh3=clamp((t3-35)/70+(Math.random()-.5)*.2,0,.7);let tpm=Math.round(r*sh3/3),rem=r-3*tpm,m2=Math.floor(rem/2);ftm+=rem-2*m2;
    const p3=clamp(.25+(t3-40)*.004+gauss()*.04,.12,.55),p2=clamp(.40+(fi-40)*.0045+gauss()*.05,.28,.75),pf=clamp(.62+(ftA-40)*.0055+gauss()*.04,.4,.95);
    const tpa=tpm?Math.max(tpm,Math.round(tpm/p3)):(sh3>.2?rnd(0,2):0),a2=m2?Math.max(m2,Math.round(m2/p2)):rnd(0,2),fta=ftm?Math.max(ftm,Math.round(ftm/pf)):(Math.random()<.3?rnd(1,2):0);
    const line=[p.id,mins[i],v,q('r'),q('a'),q('st'),q('bl'),q('to'),tpm+m2,tpa+a2,tpm,tpa,ftm,fta];
    p.g++;for(let k=0;k<12;k++)p.S[k]+=line[k+2];p.S[12]+=mins[i];lines.push(line)});
  return lines;
}
let CUR={c:-1,l:-1};
function playMatch(hid,aid,mode){ // mode 0 lig, 1 uluslararası, 2 kupa
  const H=G.teams[hid],A=G.teams[aid],rh=rating(H),ra=rating(A);
  const poss=74+(H.tempo+A.tempo-2)*2.5+rnd(-3,3);
  let hs=Math.round(poss*(1.02+(rh+H.focus*2-(ra-A.focus*2))*.012+.022+.002*H.f[0]+gauss()*.07));
  let as=Math.round(poss*(1.02+(ra+A.focus*2-(rh-H.focus*2))*.012+gauss()*.07));
  let ot=0;while(hs===as){hs+=rnd(4,14);as+=rnd(4,14);ot++}
  const bh=box(H,hs),ba=box(A,as);
  if(mode===1){H.ipf+=hs;H.ipa+=as;A.ipf+=as;A.ipa+=hs;if(hs>as){H.iw++;A.il++}else{A.iw++;H.il++}}
  else if(mode===0){H.pf+=hs;H.pa+=as;A.pf+=as;A.pa+=hs;if(hs>as){H.w++;A.lo++}else{A.w++;H.lo++}
    H.form.push(hs>as?'W':'L');A.form.push(as>hs?'W':'L');if(H.form.length>5)H.form.shift();if(A.form.length>5)A.form.shift()}
  const mine=hid===G.user||aid===G.user;let bid=null;
  if(mine||(mode===0&&H.c===CUR.c&&H.l===CUR.l)){bid=G.bxN++;G.bx[bid]={h:hid,a:aid,hs,as,ot,mode,day:G.day+1,bh,ba}}
  if(mine){G.boxes.push(bid);if((hid===G.user)===(hs>as))G.money+=Math.round(income(G.teams[G.user])*.5)}
  const top=[...bh,...ba].sort((x,y)=>y[2]-x[2])[0];
  return [hs,as,top[0],top[2],ot,bid];
}
function playDay(){
  if(G.day>=DAYS){endSeason();return}
  const d=G.day;G.boxes=[];{const U=G.teams[G.user];CUR={c:U.c,l:U.l}}
  G.countries.forEach(c=>c.leagues.forEach(lg=>{lg.res[d]=lg.fx[d].map(([h,a])=>playMatch(lg.teams[h],lg.teams[a],0))}));
  const ir=G.intl.days.indexOf(d);
  if(ir>=0)G.intl.res[ir]=G.intl.fx[ir].map(([h,a])=>(h>=G.intl.n||a>=G.intl.n)?null:playMatch(G.intl.teams[h],G.intl.teams[a],1));
  const cr=CUP_DAYS.indexOf(d);if(cr>=0)G.countries.forEach((_,ci)=>playCupRound(ci,cr));
  G.day++;
  const U=G.teams[G.user];G.money+=income(U)-Math.round(payroll(U)/DAYS);
  if(G.money<0&&!G.neg){G.neg=true;addNews('⚠️ <b>Kasa eksiye düştü!</b> Eksideyken imza, transfer ve inşaat yapamazsın. Maaş yükünü azalt.','⚠️ <b>You are in debt!</b> No signings, transfers or construction while negative. Cut your payroll.')}
  if(G.money>=0)G.neg=false;
  G.builds=G.builds.filter(b=>{b.left--;if(b.left>0)return true;U.f[b.i]++;addNews(`🏗️ ${FAC[b.i].i} <b>${FAC[b.i].tr}</b> seviye ${U.f[b.i]} oldu!`,`🏗️ ${FAC[b.i].i} <b>${FAC[b.i].en}</b> reached level ${U.f[b.i]}!`);return false});
  if(G.day===DAYS)addNews('🏁 Normal sezon bitti! Üstteki "Sezonu Tamamla" ile sezon sonu aşamasına geç.','🏁 Regular season over! Press "Finish Season" above for the off-season.');
}
function standings(ids,intl){return ids.map(id=>G.teams[id]).sort((a,b)=>{const wa=intl?a.iw:a.w,wb=intl?b.iw:b.w;if(wb!==wa)return wb-wa;return (intl?b.ipf-b.ipa:b.pf-b.pa)-(intl?a.ipf-a.ipa:a.pf-a.pa)})}

function endSeason(){
  const ist=standings(G.intl.teams,true);ist[0].titles=(ist[0].titles||0)+1;
  addNews(`🌍 Uluslararası Lig şampiyonu: <b>${esc(ist[0].name)}</b> ${flag(ist[0].c)}`,`🌍 International League champion: <b>${esc(ist[0].name)}</b> ${flag(ist[0].c)}`);
  if(ist[0].id===G.user){G.money+=INTL_PRIZE;addNews(`🏆 ULUSLARARASI ŞAMPİYONSUN! +${money(INTL_PRIZE)}`,`🏆 INTERNATIONAL CHAMPIONS! +${money(INTL_PRIZE)}`)}
  const qual=[],hist={season:G.season,champs:[],cups:[],intl:ist[0].name,ic:ist[0].c};
  G.countries.forEach((c,ci)=>{
    const S=c.leagues.map(lg=>standings(lg.teams,false));
    hist.champs.push(S[0][0].name);hist.cups.push(c.cup.champ!==null?G.teams[c.cup.champ].name:'–');qual.push(S[0][0].id);
    if(ci===G.teams[G.user].c)addNews(`🏆 ${flag(ci)} A Ligi şampiyonu: <b>${esc(S[0][0].name)}</b>`,`🏆 ${flag(ci)} A League champion: <b>${esc(S[0][0].name)}</b>`);
    S.forEach((s,li)=>{const pos=s.findIndex(t=>t.id===G.user);if(pos>=0){const pr=(17-pos)*POS_PRIZE[LEAGUES[li].t];G.money+=pr;addNews(`📊 ${LEAGUES[li].k} Ligi'ni <b>${pos+1}.</b> bitirdin. Ödül: ${money(pr)}`,`📊 You finished <b>${pos+1}${['st','nd','rd'][pos]||'th'}</b> in the ${LEAGUES[li].k} League. Prize: ${money(pr)}`)}});
    const [A,B1,B2,C1,C2,C3,C4]=S;
    const nl=[A.slice(0,14).concat([B1[0],B2[0]]),B1.slice(1,14).concat([A[14],C1[0],C2[0]]),B2.slice(1,14).concat([A[15],C3[0],C4[0]]),
      C1.slice(1).concat([B1[14]]),C2.slice(1).concat([B1[15]]),C3.slice(1).concat([B2[14]]),C4.slice(1).concat([B2[15]])];
    nl.forEach((arr,li)=>arr.forEach(t=>{if(t.l!==li){if(t.id===G.user)addNews(li<t.l?`⬆️ <b>TERFİ!</b> Yeni sezonda ${LEAGUES[li].k} Ligi'ndesin.`:`⬇️ Düştün… Yeni sezonda ${LEAGUES[li].k} Ligi'ndesin.`,li<t.l?`⬆️ <b>PROMOTED!</b> Next season you play in the ${LEAGUES[li].k} League.`:`⬇️ Relegated… Next season you play in the ${LEAGUES[li].k} League.`);t.l=li}}));
    c.leagues.forEach((lg,li)=>{lg.teams=shuffle(nl[li].map(t=>t.id));lg.fx=makeFixtures(16);lg.res=[]});
  });
  G.hist.unshift(hist);
  // gelişim + emeklilik
  const retire=new Set();
  Object.values(G.P).forEach(p=>{const tf=p.t>=0?G.teams[p.t].f:[1,1,1,1,1];develop(p,tf);const rm=1-.05*(tf[3]-1);
    if(!p.y&&(p.a>=38||(p.a>=33&&Math.random()<(p.a-32)*.18*rm)||(p.a>=30&&p.o<42&&Math.random()<.5))){retire.add(p.id);
      if(p.t===G.user)addNews(`👋 <b>${esc(p.n)}</b> (${p.a}, OVR ${p.o}) emekli oldu.`,`👋 <b>${esc(p.n)}</b> (${p.a}, OVR ${p.o}) retired.`);
      else if(p.o>=78)addNews(`⭐ Efsane emekliliği: ${esc(p.n)} ${flag(p.nat)} (OVR ${p.o})`,`⭐ Legend retires: ${esc(p.n)} ${flag(p.nat)} (OVR ${p.o})`)}});
  G.teams.forEach(t=>{t.p=t.p.filter(id=>!retire.has(id))});G.fa=G.fa.filter(id=>!retire.has(id));retire.forEach(id=>delete G.P[id]);
  // sözleşmeler
  G.teams.forEach(t=>{t.p=t.p.filter(id=>{const p=G.P[id];p.c--;if(p.c>0)return true;
    if(t.id===G.user){p.t=-1;G.fa.push(id);addNews(`📝 <b>${esc(p.n)}</b> sözleşmesi bittiği için takımdan ayrıldı.`,`📝 <b>${esc(p.n)}</b> left: contract expired.`);return false}
    if(Math.random()<.75){p.c=rnd(1,3);p.s=salary(p.o);return true}p.t=-1;G.fa.push(id);return false})});
  // kural: kullanıcı takımında en az 10 oyuncu
  {const U=G.teams[G.user],tier=LEAGUES[U.l].t;while(U.p.length<10){const fit=G.fa.map(id=>G.P[id]).filter(p=>p.o<=TIER_BASE[tier]-4).sort((a,b)=>b.o-a.o)[0]||newPlayer(U.c,2,false);
    G.fa=G.fa.filter(x=>x!==fit.id);fit.t=U.id;fit.s=salary(fit.o);fit.c=1;U.p.push(fit.id);addNews(`🧾 Kadro 10 kişinin altına düştüğü için federasyon ${esc(fit.n)} (OVR ${fit.o}) ile 1 yıllık zorunlu imza attırdı.`,`🧾 Your roster fell below 10, so the league assigned ${esc(fit.n)} (OVR ${fit.o}) on a 1-year deal.`)}}
  // altyapı
  G.teams.forEach(t=>{
    t.y=t.y.filter(id=>{const p=G.P[id];if(p.a<20)return true;p.y=false;p.s=salary(p.o);p.c=3;
      if(t.id===G.user){if(t.p.length<MAX_ROSTER){t.p.push(id);addNews(`🎓 ${esc(p.n)} yaş sınırına geldi, A takıma çıktı (3 yıllık sözleşme).`,`🎓 ${esc(p.n)} aged out of the academy and joined the first team (3-year deal).`)}else{p.t=-1;G.fa.push(id);addNews(`🎓 ${esc(p.n)} yaş sınırını aştı; kadro dolu olduğu için serbest kaldı.`,`🎓 ${esc(p.n)} aged out and left: roster was full.`)}return false}
      if(t.p.length<MAX_ROSTER)t.p.push(id);else{const w=roster(t).slice(-1)[0];if(p.o>w.o){release(t,w.id);t.p.push(id)}else{p.t=-1;G.fa.push(id)}}return false});
    const tier=LEAGUES[t.l].t,yl=t.f[2],yn=2+(yl>=5)+(yl>=9);
    for(let n=0;n<yn&&t.y.length<MAX_YOUTH;n++){const p=newPlayer(t.c,tier,true,yl-1);p.t=t.id;t.y.push(p.id);if(t.id===G.user)addNews(`🌱 Altyapıya yeni yetenek: ${esc(p.n)} (${p.a}, POT ${p.pt})`,`🌱 New academy prospect: ${esc(p.n)} (${p.a}, POT ${p.pt})`)}
    if(t.id!==G.user){botManage(t);const ch=[.35,.22,.12][tier];t.f=t.f.map(l=>l<10&&Math.random()<ch*(1-l/12)?l+1:l)}
  });
  G.fa=G.fa.filter(id=>{const p=G.P[id];if(p.a>=34){delete G.P[id];return false}return true});
  COUNTRIES.forEach((c,ci)=>{for(let i=0;i<12;i++)G.fa.push(newPlayer(ci,rnd(1,2),false).id)});
  if(G.fa.length>800){G.fa.sort((a,b)=>G.P[b].o-G.P[a].o);G.fa.slice(800).forEach(id=>delete G.P[id]);G.fa.length=800}
  G.teams.forEach(t=>{t.w=t.lo=t.pf=t.pa=0;t.form=[]});Object.values(G.P).forEach(p=>{p.g=0;p.S=newS()});G.bx={};
  setupIntl(qual);G.countries.forEach((_,ci)=>setupCup(ci));
  if(G.intl.teams.includes(G.user))addNews('🌍 Şampiyon olarak yeni sezonda <b>Uluslararası Lig</b>\'e katılıyorsun!','🌍 As champions, you enter the <b>International League</b> next season!');
  G.season++;G.day=0;G.boxes=[];addNews(`🆕 ${G.season}. sezon başladı.`,`🆕 Season ${G.season} has started.`);
}
function develop(p,f){p.a++;let d;
  if(p.a<=20)d=rnd(2,8);else if(p.a<=23)d=rnd(1,6);else if(p.a<=27)d=rnd(-1,3);else if(p.a<=30)d=rnd(-3,1);else if(p.a<=33)d=rnd(-5,0);else d=rnd(-8,-2);
  if(d>0)d+=rnd(0,Math.floor(f[1]/3));else if(d<0&&p.a>=30)d=Math.round(d*(1-.06*(f[3]-1)));
  const no=d>0?Math.min(Math.max(p.pt,p.o),p.o+d):Math.max(25,p.o+d);shiftAttrs(p,no-p.o,p.a);if(p.a>27||p.o>p.pt)p.pt=Math.max(p.pt,p.o);if(p.a>27)p.pt=p.o}
function release(t,pid){t.p=t.p.filter(x=>x!==pid);G.P[pid].t=-1;G.fa.push(pid)}
function botManage(t){
  const tier=LEAGUES[t.l].t;
  while(t.p.length<13){
    if(t.y.length){const by=t.y.map(id=>G.P[id]).sort((a,b)=>b.o-a.o)[0];if(by.o>=TIER_BASE[tier]-14){t.y=t.y.filter(x=>x!==by.id);by.y=false;by.s=salary(by.o);by.c=3;t.p.push(by.id);continue}}
    const fit=G.fa.map(id=>G.P[id]).filter(p=>(p.nat===t.c||Math.random()<.2)&&p.o<=TIER_BASE[tier]+4).sort((a,b)=>b.o-a.o)[0];
    if(fit){G.fa=G.fa.filter(x=>x!==fit.id);fit.t=t.id;fit.s=salary(fit.o);fit.c=rnd(1,3);t.p.push(fit.id)}else{const p=newPlayer(t.c,tier,false);p.t=t.id;t.p.push(p.id)}
  }
  if(t.p.length>=MAX_ROSTER&&t.y.length){const by=t.y.map(id=>G.P[id]).sort((a,b)=>b.o-a.o)[0],w=roster(t).slice(-1)[0];
    if(by.o>w.o+3){release(t,w.id);t.y=t.y.filter(x=>x!==by.id);by.y=false;by.s=salary(by.o);by.c=3;t.p.push(by.id)}}
}

function act(type,id){
  const U=G.teams[G.user],p=G.P[id],broke=()=>{if(G.money<0){toast(L('Kasa eksideyken bunu yapamazsın.','Not possible while in debt.'));return true}return false};
  if(type==='build'){const lv=U.f[id];if(lv>=10)return toast(L('Zaten maksimum seviye.','Already at max level.'));if(G.builds.some(b=>b.i===id))return toast(L('Bu tesis zaten inşaatta.','Already under construction.'));
    if(G.builds.length>=MAX_BUILDS)return toast(L(`Aynı anda en fazla ${MAX_BUILDS} inşaat.`,`Max ${MAX_BUILDS} constructions at once.`));const c=facCost(lv);if(broke())return;if(G.money<c)return toast(L('Bütçe yetmiyor: ','Not enough money: ')+money(c));
    G.money-=c;G.builds.push({i:id,left:facDays(lv)});addNews(`🚧 ${FAC[id].tr} seviye ${lv+1} inşaatı başladı (${facDays(lv)} gün, ${money(c)}).`,`🚧 ${FAC[id].en} level ${lv+1} construction started (${facDays(lv)} days, ${money(c)}).`);toast(L('İnşaat başladı!','Construction started!'))}
  if(type==='promote'){if(U.p.length>=MAX_ROSTER)return toast(L('Kadro 15 kişi, önce birini çıkar.','Roster is full (15).'));U.y=U.y.filter(x=>x!==id);p.y=false;p.s=salary(p.o);p.c=3;U.p.push(id);toast(L(p.n+' A takıma çıktı (3 yıl)',p.n+' promoted (3-year deal)'))}
  if(type==='release'){if(U.p.length<=8)return toast(L('Kadroda en az 8 oyuncu kalmalı.','Keep at least 8 players.'));release(U,id);toast(L(p.n+' serbest bırakıldı',p.n+' released'))}
  if(type==='yrelease'){U.y=U.y.filter(x=>x!==id);delete G.P[id];toast(L('Altyapı oyuncusu gönderildi','Prospect released'))}
  if(type==='renew'){if(broke())return;const el=document.getElementById('cy'+id),yrs=el?+el.value:2,ask=renewAsk(p);p.s=ask;p.c=1+yrs;
    addNews(`✍️ ${esc(p.n)} ${yrs} yıl daha imzaladı (${money(ask)}/sezon).`,`✍️ ${esc(p.n)} extended for ${yrs} more seasons (${money(ask)}/season).`);toast(L('Sözleşme uzatıldı','Contract extended'))}
  if(type==='sign'){const v=signBonus(p);if(U.p.length>=MAX_ROSTER)return toast(L('Kadro dolu (15).','Roster is full (15).'));if(broke())return;if(G.money<v)return toast(L('Bütçe yetmiyor.','Not enough money.'));
    G.money-=v;G.fa=G.fa.filter(x=>x!==id);p.t=U.id;p.s=salary(p.o);p.c=3;U.p.push(id);addNews(`✍️ ${esc(p.n)} ile 3 yıllık anlaşma (imza parası ${money(v)}, maaş ${money(p.s)}/sezon)`,`✍️ Signed ${esc(p.n)} for 3 seasons (bonus ${money(v)}, wage ${money(p.s)}/season)`);toast(L('İmza atıldı!','Signed!'))}
  if(type==='buy'){const v=buyPrice(p),T=G.teams[p.t];if(U.p.length>=MAX_ROSTER)return toast(L('Kadro dolu (15).','Roster is full (15).'));if(T.p.length<=10)return toast(L('Bu takım daha fazla oyuncu satmıyor.','This team won\'t sell more players.'));if(broke())return;if(G.money<v)return toast(L('Bütçe yetmiyor.','Not enough money.'));
    G.money-=v;T.p=T.p.filter(x=>x!==id);p.t=U.id;if(p.c<2)p.c=3;U.p.push(id);addNews(`💰 ${esc(p.n)} transfer edildi: ${esc(T.name)} → sen (${money(v)})`,`💰 Bought ${esc(p.n)} from ${esc(T.name)} (${money(v)})`);closeModal();toast(L('Transfer tamam!','Transfer done!'))}
  save();render();
}

  const rows=lg.fx.map((rd,d)=>{const k=rd.findIndex(([h,a])=>h===idx||a===idx),[h,a]=rd[k],home=h===idx,opp=G.teams[lg.teams[home?a:h]],r=lg.res[d]&&lg.res[d][k];
    let res='<span class="mut">–</span>';if(r){const my=home?r[0]:r[1],ot=home?r[1]:r[0];res=scoreLink(`<b class="${my>ot?'grt':'rdt'}">${my>ot?L('G','W'):L('M','L')} ${my}-${ot}</b>`,r[5])}
    return `<tr ${d===G.day?'class="me"':''}><td>${L('Gün','Day')} ${d+1}${CUP_DAYS.includes(d)?' 🏆':''}${G.intl.days.includes(d)&&G.intl.teams.includes(U.id)?' 🌍':''}</td><td>${home?'🏠':'✈️'}</td><td>${teamLink(opp)}</td><td>${res}</td></tr>`}).join('');
  const rd=UI.round===null?Math.max(0,G.day-1):UI.round,R=lg.fx[rd],RR=lg.res[rd];
  return `<div class="grid"><div class="card"><h3>${L('Lig fikstürün','Your league fixtures')} — ${lgName(U.l)}</h3><p class="mut">${L('Skora tıkla → maçın oyuncu istatistikleri.','Click a score → full box score.')} 🏆 ${L('kupa günü','cup day')} · 🌍 ${L('uluslararası maç','international game')}</p><table><tr><th>${L('Gün','Day')}</th><th></th><th>${L('Rakip','Opponent')}</th><th>${L('Sonuç','Result')}</th></tr>${rows}</table></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3>${L('Ligdeki tüm maçlar','All league games')}</h3><select onchange="UI.round=+this.value;render()">${lg.fx.map((_,i)=>`<option value="${i}" ${i===rd?'selected':''}>${L('Gün','Day')} ${i+1}</option>`).join('')}</select></div>
  <table>${R.map(([h,a],k)=>{const r=RR&&RR[k],tp=r&&G.P[r[2]];return `<tr><td>${esc(G.teams[lg.teams[h]].name)}</td><td class="num"><b>${r?scoreLink(r[0]+' – '+r[1],r[5]):'vs'}</b></td><td>${esc(G.teams[lg.teams[a]].name)}</td><td class="mut">${tp?esc(tp.n)+' '+r[3]+' '+L('sayı','pts'):''}</td></tr>`}).join('')}</table></div></div>`;
}
function intl(){
  const I=G.intl,st=standings(I.teams,true);let rd=-1;I.days.forEach((d,r)=>{if(d<G.day)rd=r});
  const show=Math.max(0,rd),R=I.fx[show],RR=I.res[show],next=I.days.find(d=>d>=G.day);
  return `<div class="grid"><div class="card"><h3>🌍 ${L('Uluslararası Lig','International League')}</h3><p class="mut">${L(`Geçen sezonun 20 A Ligi şampiyonu (ilk sezon: her ülkenin en güçlü takımı). Tek devre, ${I.fx.length} maç, sezona yayılmış. Şampiyona ${money(INTL_PRIZE)}.`,`Last season's 20 A League champions (season 1: each country's strongest club). Single round-robin, ${I.fx.length} games spread over the season. Winner gets ${money(INTL_PRIZE)}.`)}</p>${tableHtml(st,0,true)}</div>
  <div class="card"><h3>${rd<0?L('1. tur (oynanmadı)','Round 1 (not played)'):L(`${show+1}. tur sonuçları`,`Round ${show+1} results`)}</h3><table>${R.map(([h,a],k)=>{const H=intlTeam(h),A=intlTeam(a);if(!H||!A)return '';const r=RR&&RR[k];return `<tr><td>${flag(H.c)} ${esc(H.name)}</td><td class="num"><b>${r?scoreLink(r[0]+' – '+r[1],r[5]):'vs'}</b></td><td>${flag(A.c)} ${esc(A.name)}</td></tr>`}).join('')}</table>
  <p class="mut">${next!==undefined?L('Sıradaki tur: Gün ','Next round: Day ')+(next+1):L('Tüm turlar oynandı.','All rounds played.')}</p></div></div>`;
}
function transfer(){
  let Ls=G.fa.map(id=>G.P[id]);if(UI.faPos)Ls=Ls.filter(p=>p.pos===UI.faPos);if(UI.faC!=='')Ls=Ls.filter(p=>p.nat===+UI.faC);
  Ls.sort((a,b)=>b.o-a.o);Ls=Ls.slice(0,60);const U=G.teams[G.user];
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${L('Serbest Oyuncular','Free Agents')}</h3><div class="row">
  <select onchange="UI.faPos=this.value;render()"><option value="">${L('Tüm pozisyonlar','All positions')}</option>${POS.map(p=>`<option ${UI.faPos===p?'selected':''}>${p}</option>`).join('')}</select>
  <select onchange="UI.faC=this.value;render()"><option value="">${L('Tüm uyruklar','All nationalities')}</option>${COUNTRIES.map((c,i)=>`<option value="${i}" ${UI.faC===String(i)?'selected':''}>${c.flag} ${cn(i)}</option>`).join('')}</select></div></div>
  <div style="margin-bottom:8px">${viewBtns(UI.fav||'gen','UI.fav')}</div><p class="mut">${L(`Kadro: ${U.p.length}/${MAX_ROSTER} · Kasa: ${money(G.money)} · Serbest oyuncu bir kerelik imza parası + sezonluk maaşla 3 yıllığına gelir. Başka takımdan oyuncu almak için Ligler'den takıma tıkla (değerin 1,5 katı). Gözlemci Ağı her seviyede fiyatları %2 düşürür.`,`Roster: ${U.p.length}/${MAX_ROSTER} · Cash: ${money(G.money)} · Free agents sign for 3 seasons: one-time signing bonus + season wage. To buy from another club, click it in Leagues (1.5× value). Each Scouting level cuts prices by 2%.`)}</p>
  ${playerTable(Ls,UI.fav||'gen',{wage:p=>money(salary(p.o)),act:p=>`<button class="sm gr" onclick="act('sign',${p.id})">${L('İmzala','Sign')} ${money(signBonus(p))}</button>`})}</div></div>`;
}
function haber(){return `<div class="card"><h3>${L('Haberler','News')}</h3><ul class="news">${G.news.map(n=>`<li>${newsText(n)}</li>`).join('')}</ul></div>`}

}
function confirmNew(){document.getElementById('ng').innerHTML=`<b>${L('Emin misin?','Are you sure?')}</b> <button class="rd" onclick="newGame()">${L('Evet, sıfırla','Yes, reset')}</button> <button onclick="render()">${L('Vazgeç','Cancel')}</button>`}
function showModal(html){closeModal();const div=document.createElement('div');div.className='overlay';div.id='ov';div.onclick=e=>{if(e.target===div)closeModal()};div.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(div)}
const closeBtn=()=>`<button onclick="closeModal()">✕</button>`;
const scoreLink=(html,bid)=>bid!=null&&G.bx[bid]?`<a href="#" onclick="openBox(${bid});return false" style="color:inherit;text-decoration:underline dotted">${html}</a>`:html;
function openTeam(id){
  UI.tmId=id;const t=G.teams[id],own=id===G.user,ps=roster(t);
  showModal(`<div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${flag(t.c)} ${esc(t.name)}</h2><div class="mut">${lgName(t.l)} · ${t.w}${L('G','W')}-${t.lo}${L('M','L')} · ${L('güç','rating')} ${rating(t).toFixed(1)} · ${L('bordro','payroll')} ${money(payroll(t))} · ${own?L('senin takımın','your team'):'🤖 '+L('Bot yönetiyor','Bot-managed')}</div></div>${closeBtn()}</div>
  <div class="row" style="margin-top:8px">${FAC.map((f,i)=>`<span class="pill">${f.i} ${facName(i)}: <b>${t.f[i]}</b></span>`).join('')}</div>
  <div style="margin-top:10px">${viewBtns(UI.tmv,'UI.tmv')}</div>
  <div style="margin-top:8px">${playerTable(ps,UI.tmv,{own,act:p=>own?'':`<button class="sm" onclick="act('buy',${p.id})">${L('Al','Buy')} ${money(buyPrice(p))}</button>`})}</div>`);
}
function openPlayer(id){
  const p=G.P[id];if(!p)return;const T=p.t>=0?G.teams[p.t]:null,own=p.t===G.user,S=p.S,g=p.g||1,f=k=>p.g?(S[k]/g).toFixed(1):'-';
  const bar=i=>{const v=p.at[i],c=v>=85?'#ff7a1a':v>=72?'#2ecc71':v>=58?'#4aa3ff':v>=45?'#8b97a8':'#5a6372';return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><div style="width:150px;font-size:13px">${aName(i)}</div><div style="flex:1;height:8px;background:var(--panel2);border-radius:4px"><div style="width:${v}%;height:8px;border-radius:4px;background:${c}"></div></div><b style="width:28px;text-align:right;color:${c}">${v}</b></div>`};
  let btn='';if(T&&!own&&!p.y)btn=`<button class="pri" onclick="act('buy',${p.id})">${L('Satın al','Buy')} ${money(buyPrice(p))}</button>`;else if(!T)btn=`<button class="pri" onclick="act('sign',${p.id});closeModal()">${L('İmzala','Sign')} ${money(signBonus(p))} + ${money(salary(p.o))}/${L('sezon','season')}</button>`;
  showModal(`<div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${flag(p.nat)} ${esc(p.n)}</h2><div class="mut">${p.pos} · ${p.a} ${L('yaş','yrs')} · ${T?esc(T.name)+' ('+LEAGUES[T.l].k+')':L('Serbest oyuncu','Free agent')}${p.y?' · 🌱 '+L('genç takım','youth team'):''}</div></div>${closeBtn()}</div>
   <div class="row" style="margin:12px 0"><span class="pill">OVR ${ovrTag(p.o)}</span><span class="pill">POT ${own?ovrTag(p.pt):scoutPot(p)}</span><span class="pill">${L('Değer','Value')} <b>${money(value(p))}</b></span>${!p.y&&T?`<span class="pill">${L('Maaş','Wage')} <b>${money(p.s)}</b></span><span class="pill">${L('Sözleşme','Contract')}: ${ctrTag(p)}</span>`:''}</div>

   <div class="row" style="margin-top:6px">${[[L('Sayı','PTS'),f(0)],[L('Rib','REB'),f(1)],[L('Ast','AST'),f(2)],[L('TÇ','STL'),f(3)],[L('Blk','BLK'),f(4)],[L('TK','TOV'),f(5)],['FG%',pct(S[6],S[7])],['2P%',pct(S[6]-S[8],S[7]-S[9])],['3P%',pct(S[8],S[9])+' <span class="mut">('+S[8]+'/'+S[9]+')</span>'],['FT%',pct(S[10],S[11])]].map(([k,v])=>`<span class="pill">${k}: <b>${v}</b></span>`).join('')}</div></div>
   <div style="margin-top:12px">${btn}</div>`);
}
function openBox(id){
  const b=G.bx[id];if(!b)return;
  const tbl=(tid,lines,pts)=>{const T=G.teams[tid],tot=newS();lines.forEach(l=>{for(let k=0;k<12;k++)tot[k]+=l[k+2]});
    return `<h3 style="margin-top:14px">${flag(T.c)} ${esc(T.name)} <span class="mut">${pts}</span></h3><div class="scroll"><table><tr><th>${L('Oyuncu','Player')}</th><th class="num">${L('DK','MIN')}</th><th class="num">${L('SAY','PTS')}</th><th class="num">${L('RİB','REB')}</th><th class="num">${L('AST','AST')}</th><th class="num">${L('TÇ','STL')}</th><th class="num">BLK</th><th class="num">${L('TK','TOV')}</th><th class="num">FG</th><th class="num">2P</th><th class="num">3P</th><th class="num">FT</th></tr>
    ${lines.map(l=>{const p=G.P[l[0]];return `<tr><td>${p?pName(p)+' <span class="mut">'+p.pos+'</span>':'<span class="mut">—</span>'}</td><td class="num">${l[1]}</td><td class="num"><b>${l[2]}</b></td><td class="num">${l[3]}</td><td class="num">${l[4]}</td><td class="num">${l[5]}</td><td class="num">${l[6]}</td><td class="num">${l[7]}</td><td class="num">${l[8]}-${l[9]}</td><td class="num">${l[8]-l[10]}-${l[9]-l[11]}</td><td class="num">${l[10]}-${l[11]}</td><td class="num">${l[12]}-${l[13]}</td></tr>`}).join('')}
    <tr style="font-weight:600"><td>${L('Toplam','Totals')}</td><td></td><td class="num">${tot[0]}</td><td class="num">${tot[1]}</td><td class="num">${tot[2]}</td><td class="num">${tot[3]}</td><td class="num">${tot[4]}</td><td class="num">${tot[5]}</td><td class="num">${pct(tot[6],tot[7])}</td><td class="num">${pct(tot[6]-tot[8],tot[7]-tot[9])}</td><td class="num">${pct(tot[8],tot[9])}</td><td class="num">${pct(tot[10],tot[11])}</td></tr></table></div>`};
  showModal(`<div class="row" style="justify-content:space-between"><div><div class="mut">${MODE_N()[b.mode]} · ${L('Gün','Day')} ${b.day}</div><h2 style="margin:0">${esc(G.teams[b.h].name)} <span class="or">${b.hs} – ${b.as}</span> ${esc(G.teams[b.a].name)}${b.ot?' <span class="pill">'+L('UZ','OT')+'</span>':''}</h2></div>${closeBtn()}</div>
   ${tbl(b.h,b.bh,b.hs)}${tbl(b.a,b.ba,b.as)}`);
}
function closeModal(){const o=document.getElementById('ov');if(o)o.remove()}

    ${lg.teams.map(id=>G.teams[id]).sort((a,b)=>rating(b)-rating(a)).map(t=>`<tr><td>${esc(t.name)}</td><td class="num">${rating(t).toFixed(1)}</td><td class="num">${t.p.length}</td><td class="num">${money(payroll(t))}</td><td class="num">${money(START_MONEY[LEAGUES[t.l].t])}</td><td><button class="sm pri" onclick="chooseTeam(${t.id})">${L('Bu takımı yönet','Manage')}</button></td></tr>`).join('')}</table></div></div>`}

  <main><div class="card"><h2>${L('Ülkeni seç','Choose your country')}</h2><p class="mut">${L('6 kıtadan 20 ülke · her ülkede 7 lig (A, B1–B2, C1–C4), 112 takım · tüm takımlar şimdilik bot.','20 countries on 6 continents · 7 leagues per country (A, B1–B2, C1–C4), 112 clubs · all clubs bot-managed for now.')}</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${COUNTRIES.map((c,i)=>`<div class="ccard ${ci===i?'on':''}" onclick="UI.startC=${i};render()"><div class="f">${c.flag}</div><b>${cn(i)}</b><div class="mut" style="font-size:12px">${ccont(i)}</div></div>`).join('')}</div></div>${teams}</main>`;
}
function chooseTeam(id){G.user=id;const t=G.teams[id];G.money=START_MONEY[LEAGUES[t.l].t];UI.lc=t.c;UI.ll=t.l;UI.cc=t.c;
  addNews(`🤝 <b>${esc(t.name)}</b> takımının menajeri oldun!`,`🤝 You are the new manager of <b>${esc(t.name)}</b>!`);save();render()}
function newGame(){G=null;DB.del();UI.startC=null;UI.cc=null;render()}

document.getElementById('app').innerHTML=`<main><h2>${L('Yükleniyor…','Loading…')}</h2><p class="mut">${L('Dünya hazırlanıyor (20 ülke, 2240 takım).','Building the world (20 countries, 2,240 clubs).')}</p></main>`;
DB.open().then(()=>DB.get()).then(g=>{if(g&&g.v===VERSION)G=g;setTimeout(render,30)});
